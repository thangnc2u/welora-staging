<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · Đặt lại mật khẩu</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app,#121A28);color:var(--text-primary,#F4F1E8);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
h1{font-size:1.25rem;margin:4px 0 8px}
.muted{color:var(--text-secondary,#A8B0C0);font-size:13px}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;margin-top:10px;font-size:13px;color:var(--text-secondary)}
input{width:100%;box-sizing:border-box;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-default);background:var(--bg-subtle,#0B1220);color:var(--text-primary)}
button.welora-btn-primary{width:100%;margin-top:14px;padding:12px;cursor:pointer;font-size:15px;background:var(--cta-primary,#D4AF37);color:var(--cta-primary-text,#121A28)}
.err{color:var(--danger-text,#F5B4B4);font-size:13px;margin-top:10px}
.ok{color:var(--color-success,#3DB88A);font-size:13px;margin-top:10px;font-weight:600}
a{color:var(--link,#E8C86A);text-decoration:none;font-weight:600}
</style>
</head>
<body class="welora-shell">
<p><a id="navLogin" href="/app/login">← Đăng nhập</a></p>
<h1>Đặt lại mật khẩu</h1>
<p class="muted">Dùng reset_token từ form quên mật khẩu (token stub staging).</p>
<div class="card">
  <label for="token">reset_token</label>
  <input id="token" type="text" autocomplete="off"/>
  <label for="password">Mật khẩu mới</label>
  <input id="password" type="password" autocomplete="new-password"/>
  <button type="button" id="btnReset" class="welora-btn-primary">Cập nhật mật khẩu</button>
  <p class="err" id="err"></p>
  <p class="ok" id="ok"></p>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var t=q.get('token')||'';
  if(!t){try{t=sessionStorage.getItem('welora_reset_token')||'';}catch(_e){}}
  if(t) document.getElementById('token').value=t;
})();
function showErr(m){document.getElementById('err').textContent=m||'';document.getElementById('ok').textContent='';}
document.getElementById('btnReset').addEventListener('click', async()=>{
  showErr('');
  const reset_token=document.getElementById('token').value.trim();
  const new_password=document.getElementById('password').value;
  if(!reset_token){showErr('Cần reset_token');return;}
  if(new_password.length<8){showErr('Mật khẩu tối thiểu 8 ký tự');return;}
  try{
    const r=await fetch('/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reset_token,new_password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){showErr((d.detail&&d.detail.error)||d.error||'Không đặt lại được');return;}
    document.getElementById('ok').textContent='Đã cập nhật · hãy đăng nhập lại';
    setTimeout(()=>{location.href='/app/login';},600);
  }catch(e){showErr('Không kết nối được');}
});
</script>
</body>
</html>
