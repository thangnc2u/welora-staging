<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · An Toàn</title>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;margin:0;background:#f6f7f9;color:#1a1d21}
body.welora-shell{background:#f6f7f9;color:#1a1d21;max-width:none;padding:0;margin:0}
.shell{max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;padding:16px 16px 88px}
.badge-card,.hs-card,.goal-card{border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb}
.badge-card.ok{background:#ecfdf5}.badge-card.fail{background:#fff7ed}
.status{font-weight:700;font-size:18px}.meta{color:#6b7280;font-size:14px}
.bar{height:8px;background:#eef2f0;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:#0f766e}
input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #e5e7eb;box-sizing:border-box}
button{background:#0f766e;color:#fff;border:0;font-weight:600}
.chips{display:flex;gap:8px;margin-top:8px}
.chips button{margin:0;padding:8px 10px;width:auto;background:#134e4a}
a{color:#0f766e}.section-title{font-size:13px;font-weight:700;color:#6b7280;margin:8px 0}
.hs-note{font-size:11px;color:#c2410c;background:#fff7ed;border-radius:8px;padding:8px;margin-top:8px}
.hs-row{display:flex;justify-content:space-between;font-size:14px;margin:6px 0;color:#374151}
.check-item{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;background:#fff}
.check-item.ok{background:#ecfdf5;border-color:#a7f3d0}
.check-item.fail{background:#fff7ed;border-color:#fed7aa}
.check-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.check-label{font-weight:600;font-size:14px}
.check-state{font-size:12px;color:#6b7280}
.check-item a.cta{display:inline-block;margin-top:4px;font-weight:600}
#ctaGateChat{display:block;margin:10px 0 14px;padding:12px;border-radius:12px;background:#0f766e;color:#fff;text-align:center;text-decoration:none;font-weight:700}
#ctaGateChat[hidden]{display:none}
#masteryState[hidden]{display:none}
</style></head><body>
<p><a id="navHome" href="/app">← Welora</a></p>
<div class="shell">
  <h1>An Toàn</h1>
  <div class="section-title">Checklist cổng</div>
  <div id="gateCard" class="badge-card fail"><div class="status" id="gateStatus">CHƯA ĐẠT</div><div class="meta" id="gateMeta"></div></div>
  <div id="gateChecklist"></div>
  <a id="ctaGateChat" href="/app/chat" hidden>Chat với Agent</a>
  <div class="badge-card fail" id="masteryBadge">
    <div class="status" id="masteryStatus">Hiểu nguyên tắc · —</div>
    <div class="meta" id="masteryMeta">Cổng kiến thức: chưa</div>
    <select id="masteryState" hidden>
      <option value="not_started">Chưa bắt đầu</option><option value="learning">Đang học</option>
      <option value="familiar">Quen thuộc</option><option value="apply">Áp dụng</option><option value="mastered">Thành thạo</option>
    </select>
    <p><a id="ctaMasteryLearn" href="/app/academy">Học trên Welorademy</a> · <a href="/app/content?key=SAFE-02">An Toàn · Khi nào được dùng quỹ</a></p>
  </div>
  <div class="section-title">Điểm sức khỏe</div>
  <div class="hs-card" id="hsCard"><div id="hsScore">— / 1000</div><div id="hsBars"></div>
    <div class="hs-note">Điểm không bỏ qua Cổng An Toàn</div></div>
  <div class="section-title">Mục tiêu</div>
  <div class="goal-card" id="goalCard">
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="meta" id="goalMeta">Chưa có quỹ khẩn cấp</div>
    <label>Chi tiêu thiết yếu / tháng</label>
    <input id="essential" type="text" inputmode="numeric" value="10.000.000 ₫" data-vnd="10000000"/>
    <div class="chips" id="essChips">
      <button type="button" data-vnd="5000000">5tr</button>
      <button type="button" data-vnd="10000000">10tr</button>
      <button type="button" data-vnd="20000000">20tr</button>
    </div>
    <button id="btnCreate">Tạo quỹ khẩn cấp 3 tháng</button>
    <label>Số dư quỹ</label>
    <input id="amount" type="text" inputmode="numeric" value="0 ₫" data-vnd="0"/>
    <div class="chips" id="amtChips">
      <button type="button" data-vnd="5000000">5tr</button>
      <button type="button" data-vnd="10000000">10tr</button>
      <button type="button" data-vnd="20000000">20tr</button>
    </div>
    <button id="btnSave">Lưu số dư</button>
  </div>
  <div class="goal-card" id="debtCard">
    <div class="meta" id="debtTitle">Trả nợ</div>
    <div class="bar"><i id="debtBarFill" style="width:0%"></i></div>
    <div class="meta" id="debtMeta">Chưa có mục tiêu trả nợ</div>
    <p><a id="ctaGoalsDebt" href="/app/goals?focus=debt">Mở Mục tiêu · Trả nợ</a></p>
  </div>
</div>
<script src="/static/money.js"></script>
<script>
const HS_LABELS={
  cashflow:'Dòng tiền',
  emergency_fund:'Quỹ khẩn cấp',
  debt:'Nợ',
  savings_invest_rate:'Tiết kiệm / đầu tư',
  behavior_consistency:'Hành vi nhất quán'
};
const GATE_REASON_VI={
  data_missing:'Thiếu dữ liệu',
  emergency_fund_below_3_months:'Quỹ khẩn cấp dưới 3 tháng',
  dangerous_debt_unhandled:'Nợ nguy hiểm chưa xử lý',
  mastery_missing:'Chưa đạt làm chủ (cần Áp dụng)',
  recent_hard_rule_violation:'Vi phạm Luật cứng gần đây'
};
function formatGateReasons(reasons, passed){
  const list=reasons||[];
  if(!list.length) return passed?'—':'';
  return list.map(c=>GATE_REASON_VI[c]||c).join(' · ');
}
const state={userId:null,goal:null,debt:null,gate:null,health:null,mastery:null};
async function api(path,opts={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});return r.json();}
WeloraMoney.bindMoneyInput(document.getElementById('essential'));
WeloraMoney.bindMoneyInput(document.getElementById('amount'));
WeloraMoney.bindChips(document.getElementById('essChips'), document.getElementById('essential'));
WeloraMoney.bindChips(document.getElementById('amtChips'), document.getElementById('amount'));
async function load(){
  const id=localStorage.getItem("welora_device_id")||("web-"+Math.random().toString(36).slice(2,10));
  localStorage.setItem("welora_device_id",id);
  const auth=await api("/auth/device",{method:"POST",body:JSON.stringify({device_id:id})});
  state.userId=auth.user_id;
  const list=await api("/goals?user_id="+encodeURIComponent(state.userId)+"&type=emergency_fund");
  state.goal=(list.items&&list.items[0])||null;
  const debts=await api("/goals?user_id="+encodeURIComponent(state.userId)+"&type=debt_payoff");
  const items=(debts.items||[]).filter(g=>g.type==="debt_payoff");
  state.debt=items[0]||null;
  state.gate=await api("/users/"+state.userId+"/safety-gate");
  try{state.health=await api("/users/"+state.userId+"/health-score")}catch(_){state.health=null}
  try{state.mastery=await api("/users/"+state.userId+"/mastery?node_id=no_efund_invest")}catch(_){state.mastery={state:"not_started",meets_gate:false}}
  render();
}
function renderHsBars(components){
  const box=document.getElementById("hsBars");
  box.textContent="";
  Object.keys(HS_LABELS).forEach(k=>{
    const row=document.createElement("div");
    row.className="hs-row";
    const lab=document.createElement("span");
    lab.textContent=HS_LABELS[k];
    const val=document.createElement("span");
    val.textContent=String((components[k]&&components[k].score)||0);
    row.appendChild(lab);
    row.appendChild(val);
    box.appendChild(row);
  });
}
function addCheckItem(box, item){
  const el=document.createElement('div');
  el.className='check-item '+(item.ok?'ok':'fail');
  el.dataset.key=item.key;
  const row=document.createElement('div');
  row.className='check-row';
  const lab=document.createElement('div');
  lab.className='check-label';
  lab.textContent=item.label;
  const stEl=document.createElement('div');
  stEl.className='check-state';
  stEl.textContent=item.ok?'Đạt':'Chưa';
  row.appendChild(lab); row.appendChild(stEl);
  el.appendChild(row);
  if(!item.ok && item.ctaHref && item.ctaText){
    const a=document.createElement('a');
    a.className='cta';
    a.href=item.ctaHref;
    a.textContent=item.ctaText;
    el.appendChild(a);
  }
  box.appendChild(el);
}
function renderGateChecklist(passed){
  const box=document.getElementById('gateChecklist');
  box.textContent='';
  const reasons=new Set((state.gate&&state.gate.reasons)||[]);
  const masteryOk=!!(state.mastery&&state.mastery.meets_gate);
  addCheckItem(box,{
    key:'emergency_fund',
    label:'Quỹ khẩn cấp ≥ 3 tháng',
    ok:passed || !reasons.has('emergency_fund_below_3_months'),
    ctaHref:'#goalCard',
    ctaText: state.goal ? 'Cập nhật số dư quỹ' : 'Tạo quỹ khẩn cấp 3 tháng'
  });
  if(reasons.has('dangerous_debt_unhandled') || state.debt){
    addCheckItem(box,{
      key:'dangerous_debt',
      label:'Nợ nguy hiểm đã xử lý',
      ok:passed || !reasons.has('dangerous_debt_unhandled'),
      ctaHref:'/app/goals?focus=debt',
      ctaText:'Tạo mục tiêu trả nợ'
    });
  }
  addCheckItem(box,{
    key:'mastery',
    label:'Làm chủ nguyên tắc (Áp dụng trở lên)',
    ok:passed || masteryOk || !reasons.has('mastery_missing'),
    ctaHref:'/app/academy',
    ctaText:'Học trên Welorademy'
  });
}
function render(){
  const passed=state.gate&&state.gate.status==="passed";
  document.getElementById("gateCard").className="badge-card "+(passed?"ok":"fail");
  document.getElementById("gateStatus").textContent=passed?"ĐẠT":"CHƯA ĐẠT";
  document.getElementById("gateMeta").textContent=formatGateReasons(state.gate&&state.gate.reasons, passed);
  renderGateChecklist(passed);
  const chat=document.getElementById('ctaGateChat');
  if(chat) chat.hidden=!passed;
  const st=(state.mastery&&state.mastery.state)||"not_started";
  const ok=!!(state.mastery&&state.mastery.meets_gate);
  document.getElementById("masteryBadge").className="badge-card "+(ok?"ok":"fail");
  document.getElementById("masteryStatus").textContent="Hiểu nguyên tắc · "+(st==="not_started"?"Chưa bắt đầu":st==="learning"?"Đang học":st==="familiar"?"Quen thuộc":st==="apply"?"Áp dụng":st==="mastered"?"Thành thạo":st);
  document.getElementById("masteryMeta").textContent="Cổng kiến thức: "+(ok?"đạt":"chưa");
  const ms=document.getElementById("masteryState");
  if(ms){ ms.value=st; ms.hidden=true; }
  if(state.health){
    document.getElementById("hsScore").textContent=(state.health.score||0)+" / 1000";
    renderHsBars(state.health.components||{});
  }
  if(state.goal){
    const pct=Math.min(100,Number(state.goal.current&&state.goal.current.percent||0));
    document.getElementById("barFill").style.width=pct+"%";
    const cur=state.goal.current&&state.goal.current.amount||0;
    const tgt=state.goal.target&&state.goal.target.amount||0;
    document.getElementById("goalMeta").textContent=WeloraMoney.formatVnd(cur)+" / "+WeloraMoney.formatVnd(tgt)+" · "+WeloraMoney.formatPct(pct);
    document.getElementById("amount").value=WeloraMoney.formatVnd(cur);
    document.getElementById("amount").setAttribute("data-vnd", String(cur));
  }
  const dt=document.getElementById("debtTitle");
  const dm=document.getElementById("debtMeta");
  const db=document.getElementById("debtBarFill");
  const link=document.getElementById("ctaGoalsDebt");
  if(link) link.href="/app/goals?focus=debt";
  if(state.debt){
    dt.textContent=state.debt.title||"Trả nợ nguy hiểm";
    const paid=state.debt.current&&state.debt.current.amount||0;
    const tgt=state.debt.target&&state.debt.target.amount||0;
    const pct=Math.min(100,Number(state.debt.current&&state.debt.current.percent||0));
    dm.textContent=WeloraMoney.formatVnd(paid)+" / "+WeloraMoney.formatVnd(tgt)+" · "+WeloraMoney.formatPct(pct);
    db.style.width=pct+"%";
    link.textContent="Mở Mục tiêu · Trả nợ";
  }else{
    dt.textContent="Trả nợ";
    dm.textContent="Chưa có mục tiêu trả nợ";
    db.style.width="0%";
    link.textContent="Bạn đã khai nợ nguy hiểm — tạo mục tiêu trả nợ";
  }
}
document.getElementById("masteryState").onchange=async e=>{
  state.mastery=await api("/users/"+state.userId+"/mastery",{method:"PATCH",body:JSON.stringify({node_id:"no_efund_invest",state:e.target.value})});
  state.gate=await api("/users/"+state.userId+"/safety-gate"); render();
};
document.getElementById("btnCreate").onclick=async()=>{
  const ess=WeloraMoney.parseVnd(document.getElementById("essential").value);
  await api("/goals",{method:"POST",body:JSON.stringify({user_id:state.userId,type:"emergency_fund",essential_expense_monthly:ess,current_amount:0})});
  await load();
};
document.getElementById("btnSave").onclick=async()=>{
  if(!state.goal) return;
  const val=WeloraMoney.parseVnd(document.getElementById("amount").value);
  await api("/goals/"+state.goal.goal_id+"/progress",{method:"PATCH",body:JSON.stringify({set_amount:val})});
  await load();
};
load();
</script>
<script src="/static/shell.js" data-shell-tab="home"></script></body></html>
