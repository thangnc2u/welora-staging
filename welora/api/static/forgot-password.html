<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · Quên mật khẩu</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app,#121A28);color:var(--text-primary,#F4F1E8);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
h1{font-size:1.25rem;margin:4px 0 8px}
.muted{color:var(--text-secondary,#A8B0C0);font-size:13px}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;margin-top:10px;font-size:13px;color:var(--text-secondary)}
input{width:100%;box-sizing:border-box;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-default);background:var(--bg-subtle,#0B1220);color:var(--text-primary)}
button.welora-btn-primary{width:100%;margin-top:14px;padding:12px;cursor:pointer;font-size:15px;background:var(--cta-primary,#D4AF37);color:var(--cta-primary-text,#121A28)}
.err{color:var(--danger-text,#F5B4B4);font-size:13px;margin-top:10px}
.ok{color:var(--color-success,#3DB88A);font-size:13px;margin-top:10px;font-weight:600}
.stub{margin-top:12px;padding:10px;border-radius:10px;background:var(--bg-elevated,#243044);font-size:12px;word-break:break-all;color:var(--text-secondary)}
a{color:var(--link,#E8C86A);text-decoration:none;font-weight:600}
</style>
</head>
<body class="welora-shell">
<p><a id="navLogin" href="/app/login">← Đăng nhập</a></p>
<h1>Quên mật khẩu</h1>
<p class="muted">Staging MVP · token stub (không gửi email/SMS). Nhận reset_token rồi đặt lại mật khẩu.</p>
<div class="card">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username"/>
  <label for="phone">hoặc Số điện thoại</label>
  <input id="phone" type="tel" inputmode="tel"/>
  <button type="button" id="btnForgot" class="welora-btn-primary">Xin mã đặt lại</button>
  <p class="err" id="err"></p>
  <p class="ok" id="ok"></p>
  <div class="stub hide" id="stubWrap" hidden>
    <div class="muted">reset_token (staging stub)</div>
    <div id="resetToken"></div>
    <p style="margin-top:8px"><a id="linkReset" href="/app/reset-password">Đặt lại mật khẩu →</a></p>
  </div>
</div>
<script>
function showErr(m){document.getElementById('err').textContent=m||'';document.getElementById('ok').textContent='';}
document.getElementById('btnForgot').addEventListener('click', async()=>{
  showErr('');
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  if(!email && !phone){showErr('Nhập email hoặc số điện thoại');return;}
  const body={};
  if(email) body.email=email;
  if(phone) body.phone=phone;
  try{
    const r=await fetch('/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){showErr((d.detail&&d.detail.error)||d.error||'Không xin được mã');return;}
    document.getElementById('ok').textContent=d.note||'Đã xử lý';
    const tok=d.reset_token||'';
    const wrap=document.getElementById('stubWrap');
    if(tok){
      document.getElementById('resetToken').textContent=tok;
      wrap.hidden=false;
      try{sessionStorage.setItem('welora_reset_token',tok);}catch(_e){}
      document.getElementById('linkReset').href='/app/reset-password?token='+encodeURIComponent(tok);
    }else{wrap.hidden=true;}
  }catch(e){showErr('Không kết nối được');}
});
</script>
</body>
</html>
