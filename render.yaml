# Render Blueprint — Welora Staging (P2-E2)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: welora-staging
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: WELORA_STORE
        value: sqlite
      - key: WELORA_DB_URL
        value: /tmp/welora_staging.db
      - key: WELORA_LLM_PROVIDER
        value: stub
      - key: WELORA_ENV
        value: staging
