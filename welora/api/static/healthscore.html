<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="/static/auth-gate.js"></script>
<title>Welora · Điểm sức khỏe</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app);color:var(--text-primary);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
a{color:var(--link);text-decoration:none}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:12px;padding:14px;margin:10px 0;color:var(--text-primary,#F4F1E8)}
.label{color:var(--text-secondary);font-size:13px}
.row{margin-top:6px;display:flex;justify-content:space-between}
.err{color:var(--color-danger)}
.note{font-size:13px;color:var(--text-secondary);margin-top:8px}
#hsScore{font-size:1.6rem;font-weight:700;color:var(--text-primary)}
</style>
</head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Điểm sức khỏe</h1>
<div class="card">
  <div class="label">Điểm</div>
  <div id="hsScore">—</div>
  <div class="row"><span class="label">Mức</span><span id="hsLevel">—</span></div>
  <p class="note" id="hsBypassNote">Điểm không bỏ qua Cổng An Toàn</p>
</div>
<div class="card" id="hsComponents"></div>
<p class="err" id="hsErr"></p>
<script>
const KEY='welora_device_id';
const LABELS={
  cashflow:'Dòng tiền',
  emergency_fund:'Quỹ khẩn cấp',
  debt:'Nợ',
  savings_invest_rate:'Tiết kiệm / đầu tư',
  behavior_consistency:'Hành vi nhất quán'
};
function deviceId(){
  let d=localStorage.getItem(KEY);
  if(!d){d='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY,d);}
  return d;
}
function addRow(parent,label,val){
  const row=document.createElement('div');
  row.className='row';
  const a=document.createElement('span');
  a.className='label';
  a.textContent=label;
  const b=document.createElement('span');
  b.textContent=val;
  row.appendChild(a);
  row.appendChild(b);
  parent.appendChild(row);
}
(async()=>{
  try{
    const auth=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId()})});
    const a=await auth.json();
    const uid=a.user_id||'';
    const r=await fetch('/users/'+encodeURIComponent(uid)+'/health-score');
    const j=await r.json();
    const score=j.score;
    document.getElementById('hsScore').textContent=(score==null?'—':String(score)+' / 1000');
    const LEVELS={critical:'Nguy cấp',low:'Thấp',moderate:'Trung bình',good:'Tốt',strong:'Vững'};
    const raw=j.level||'—';
    document.getElementById('hsLevel').textContent=LEVELS[raw]||raw;
    const note=document.getElementById('hsBypassNote');
    if(j.can_bypass_gate_with_score===false || j.can_bypass_gate_with_score==null){
      note.textContent='Điểm không bỏ qua Cổng An Toàn';
    }
    const box=document.getElementById('hsComponents');
    const comps=j.components||{};
    Object.keys(LABELS).forEach(k=>{
      const c=comps[k]||{};
      addRow(box, LABELS[k], String(c.score==null?'—':c.score));
    });
  }catch(e){
    document.getElementById('hsErr').textContent='Không đọc được điểm sức khỏe';
  }
})();
</script>
<script src="/static/shell.js" data-shell-tab="ops"></script>
</body>
</html>
