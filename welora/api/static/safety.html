<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welora — An Toàn</title>
  <style>
    body{font-family:system-ui;margin:0;background:#f6f7f9;color:#1a1d21}
    .shell{max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;padding:16px}
    .badge-card{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #e5e7eb}
    .badge-card.ok{background:#ecfdf5}.badge-card.fail{background:#fff7ed}
    .status{font-weight:700;font-size:18px}
    .meta{color:#6b7280;font-size:14px}
    select{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #e5e7eb}
    a{color:#0f766e}
  </style>
</head>
<body>
  <div class="shell">
    <h1>An Toàn</h1>
    <div id="gateCard" class="badge-card fail">
      <div class="status" id="gateStatus">CHUA DAT</div>
      <div class="meta" id="gateMeta"></div>
    </div>
    <div class="badge-card fail" id="masteryBadge">
      <div class="status" id="masteryStatus">Mastery · —</div>
      <div class="meta" id="masteryMeta">meets_gate: false</div>
      <select id="masteryState">
        <option value="not_started">not_started</option>
        <option value="learning">learning</option>
        <option value="familiar">familiar</option>
        <option value="apply">apply</option>
        <option value="mastered">mastered</option>
      </select>
      <p><a href="/app/content?key=SAFE-02">Hoc SAFE-02</a></p>
    </div>
  </div>
  <script>
    const state = { userId: null, gate: null, mastery: null };
    async function api(path, opts={}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
      return res.json();
    }
    async function load() {
      const deviceId = localStorage.getItem("welora_device_id") || ("web-" + Math.random().toString(36).slice(2,10));
      localStorage.setItem("welora_device_id", deviceId);
      const auth = await api("/auth/device", { method: "POST", body: JSON.stringify({ device_id: deviceId }) });
      state.userId = auth.user_id;
      state.gate = await api("/users/" + state.userId + "/safety-gate");
      try { state.mastery = await api("/users/" + state.userId + "/mastery?node_id=no_efund_invest"); }
      catch (_) { state.mastery = { state: "not_started", meets_gate: false }; }
      render();
    }
    function render() {
      const passed = state.gate && state.gate.status === "passed";
      document.getElementById("gateCard").className = "badge-card " + (passed ? "ok" : "fail");
      document.getElementById("gateStatus").textContent = passed ? "DAT" : "CHUA DAT";
      document.getElementById("gateMeta").textContent = JSON.stringify(state.gate && state.gate.reasons || []);
      const st = (state.mastery && state.mastery.state) || "not_started";
      const ok = !!(state.mastery && state.mastery.meets_gate);
      document.getElementById("masteryBadge").className = "badge-card " + (ok ? "ok" : "fail");
      document.getElementById("masteryStatus").textContent = "Mastery · " + st;
      document.getElementById("masteryMeta").textContent = "meets_gate: " + ok;
      document.getElementById("masteryState").value = st;
    }
    document.getElementById("masteryState").onchange = async (e) => {
      state.mastery = await api("/users/" + state.userId + "/mastery", {
        method: "PATCH", body: JSON.stringify({ node_id: "no_efund_invest", state: e.target.value })
      });
      state.gate = await api("/users/" + state.userId + "/safety-gate");
      render();
    };
    load();
  </script>
</body>
</html>
