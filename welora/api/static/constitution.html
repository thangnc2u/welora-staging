<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · Hiến pháp cá nhân</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app);color:var(--text-primary);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
a{color:var(--link);text-decoration:none}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:12px;padding:14px;margin:10px 0;color:var(--text-primary)}
.code{color:var(--link);font-weight:700;font-size:13px}
.text{margin-top:6px;line-height:1.45}
.muted{color:var(--text-secondary);font-size:13px}
.empty{color:var(--text-secondary);margin-top:16px}
</style>
</head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Hiến pháp cá nhân</h1>
<p class="muted">Điều bạn đã xác nhận khi Bắt đầu</p>
<p><a id="ctaOsGoal" href="/app/goals">Tạo mục tiêu quỹ khẩn cấp trên WeloraOS</a></p>
<div id="articles"></div>
<script>
const KEY='welora_device_id';
function deviceId(){
  let d=localStorage.getItem(KEY);
  if(!d){d='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY,d);}
  return d;
}
function showEmpty(){
  const box=document.getElementById('articles');
  box.textContent='';
  const p=document.createElement('p');
  p.className='empty';
  p.id='emptyState';
  p.textContent='Chưa có Hiến pháp. Hãy hoàn tất Bắt đầu rồi quay lại đây.';
  box.appendChild(p);
}
function renderArticles(list){
  const box=document.getElementById('articles');
  box.textContent='';
  if(!list||!list.length){showEmpty();return;}
  list.forEach(a=>{
    const el=document.createElement('div');
    el.className='card';
    const c=document.createElement('div');
    c.className='code';
    c.textContent=a.code||a.id||'—';
    const t=document.createElement('div');
    t.className='text';
    t.textContent=a.text||a.title||'';
    el.appendChild(c);
    el.appendChild(t);
    box.appendChild(el);
  });
}
(async()=>{
  try{
    const auth=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId()})});
    const a=await auth.json();
    const uid=a.user_id||a.user||'';
    const cr=await fetch('/users/'+encodeURIComponent(uid)+'/personal-constitution');
    if(cr.status===404||!cr.ok){showEmpty();return;}
    const data=await cr.json();
    const list=data.articles||(data.personal_constitution&&data.personal_constitution.articles)||[];
    renderArticles(list);
  }catch(e){
    showEmpty();
  }
})();
</script>
<script src="/static/shell.js" data-shell-tab="ops"></script>
</body>
</html>
