<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · Bảng giá</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app,#121A28);color:var(--text-primary,#F4F1E8);margin:0;padding:16px 16px 88px;max-width:560px;margin-inline:auto}
h1{font-size:1.35rem;margin:4px 0 8px}
.muted{color:var(--text-secondary,#A8B0C0);font-size:13px}
a{color:var(--link,#E8C86A);text-decoration:none;font-weight:600}
.banner{background:#3A2E12;border:1px solid #E8C86A;color:#F4F1E8;border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:700;font-size:14px}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:14px;padding:16px;margin:12px 0}
.plan-name{font-size:1.1rem;font-weight:700;margin:0 0 4px}
.plan-code{font-size:12px;color:var(--text-secondary);font-weight:600;letter-spacing:.02em}
.plan-desc{font-size:13px;color:var(--text-secondary);margin:8px 0 12px;line-height:1.45}
.price-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--border-default);font-size:14px}
.price-row:first-of-type{border-top:0}
.amount{font-weight:700;color:var(--link,#E8C86A)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--border-default);margin-left:6px}
.badge.trial{border-color:#6B8CFF;color:#6B8CFF}
.ents{margin:0;padding-left:18px;font-size:13px;color:var(--text-secondary)}
.ents li{margin:4px 0}
.disclaimer{font-size:12px;line-height:1.5;color:var(--text-secondary);border-left:3px solid var(--border-default);padding:8px 12px;margin:16px 0;background:var(--bg-subtle,#162033);border-radius:0 10px 10px 0}
.cta{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--bg-subtle);border:1px solid var(--border-default);color:var(--text-primary);font-weight:700;font-size:13px;cursor:pointer}
.cta[disabled]{opacity:.55;cursor:not-allowed}
.err{color:#ff6b6b;font-size:13px}
.exp{font-size:11px;color:var(--text-secondary);margin-top:8px}
</style>
</head>
<body class="welora-shell">
<p><a id="navHome" href="/app">← Welora</a> · <a id="navLogin" href="/app/login">Đăng nhập</a></p>
<h1 id="pageTitle">Bảng giá</h1>
<p class="muted" id="pageLead">Gói Welora — giá tải từ máy chủ, không ghi cứng trên trang.</p>

<div class="banner" id="checkoutBanner" hidden role="status">Sắp mở thanh toán</div>
<p class="err" id="loadErr" hidden></p>
<div id="plans" aria-live="polite"></div>

<section class="disclaimer" id="firewallDisclaimer" aria-label="Tuyên bố Firewall">
  Welora cung cấp thông tin và công cụ quản lý tài chính cá nhân, không tư vấn đầu tư,
  không nhận hoa hồng hay liên kết tiếp thị (affiliate) với bất kỳ sản phẩm tài chính nào.
</section>

<p class="exp" id="expNote"></p>

<script>
(function () {
  var plansEl = document.getElementById("plans");
  var bannerEl = document.getElementById("checkoutBanner");
  var errEl = document.getElementById("loadErr");
  var discEl = document.getElementById("firewallDisclaimer");
  var expEl = document.getElementById("expNote");

  function formatVnd(n) {
    try {
      return new Intl.NumberFormat("vi-VN").format(Number(n)) + " ₫";
    } catch (_e) {
      return String(n) + " VND";
    }
  }

  function intervalLabel(iv) {
    if (iv === "month") return "Tháng";
    if (iv === "year") return "Năm";
    if (iv === "free") return "Miễn phí";
    return iv || "";
  }

  function entitlementLabel(e) {
    var k = (e && e.key) || "";
    var lim = e && e.limit != null ? " (tối đa " + e.limit + ")" : "";
    return k + lim;
  }

  function render(data) {
    var checkoutOn = !!(data && data.checkout_enabled);
    bannerEl.hidden = checkoutOn;
    if (!checkoutOn) {
      bannerEl.textContent = "Sắp mở thanh toán";
      bannerEl.hidden = false;
    }
    if (data && data.disclaimer) {
      discEl.textContent = data.disclaimer;
    }
    var exps = (data && data.experiments) || [];
    var ab = exps.filter(function (x) { return x.key === "aca_price_ab"; })[0];
    if (ab) {
      expEl.textContent = "Thử nghiệm aca_price_ab: " +
        (ab.active ? "bật" : "tắt") + " · biến thể " + (ab.variant || "A");
    }
    var plans = (data && data.plans) || [];
    while (plansEl.firstChild) plansEl.removeChild(plansEl.firstChild);
    plans.forEach(function (p) {
      var card = document.createElement("article");
      card.className = "card";
      card.setAttribute("data-plan", p.code || "");

      var name = document.createElement("h2");
      name.className = "plan-name";
      name.textContent = p.name || p.code || "";
      if (p.trial && p.trial.days) {
        var b = document.createElement("span");
        b.className = "badge trial";
        b.textContent = "Dùng thử " + p.trial.days + " ngày";
        name.appendChild(b);
      }
      card.appendChild(name);

      var code = document.createElement("div");
      code.className = "plan-code";
      code.textContent = p.code || "";
      card.appendChild(code);

      var desc = document.createElement("p");
      desc.className = "plan-desc";
      desc.textContent = p.description || "";
      card.appendChild(desc);

      var ul = document.createElement("ul");
      ul.className = "ents";
      (p.entitlements || []).forEach(function (e) {
        var li = document.createElement("li");
        li.textContent = entitlementLabel(e);
        ul.appendChild(li);
      });
      card.appendChild(ul);

      (p.prices || []).forEach(function (pr) {
        var row = document.createElement("div");
        row.className = "price-row";
        var left = document.createElement("span");
        left.textContent = intervalLabel(pr.interval);
        var right = document.createElement("span");
        right.className = "amount";
        right.setAttribute("data-price-id", pr.price_id || "");
        right.textContent = Number(pr.amount) === 0 ? "0 ₫" : formatVnd(pr.amount);
        row.appendChild(left);
        row.appendChild(right);
        card.appendChild(row);
      });

      if (p.trial && p.trial.verification === "phone_otp") {
        var trialNote = document.createElement("p");
        trialNote.className = "muted";
        trialNote.textContent = "Dùng thử cần xác minh SĐT (OTP).";
        card.appendChild(trialNote);
      }

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cta";
      btn.textContent = checkoutOn ? "Chọn gói" : "Sắp mở thanh toán";
      btn.disabled = !checkoutOn;
      card.appendChild(btn);

      plansEl.appendChild(card);
    });
  }

  function emitView() {
    try {
      fetch("/api/core/v1/entitlements/events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ event: "pricing.view", payload: { path: "/pricing" } })
      }).catch(function () {});
    } catch (_e) {}
  }

  fetch("/api/core/v1/entitlements/pricing")
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      errEl.hidden = true;
      render(data);
      emitView();
    })
    .catch(function () {
      errEl.hidden = false;
      errEl.textContent = "Không tải được bảng giá. Thử lại sau.";
    });
})();
</script>
</body>
</html>
