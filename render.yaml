# Render Blueprint — Welora Staging
services:
  - type: web
    name: welora-staging
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn welora.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: WELORA_STORE
        value: sqlite
      - key: WELORA_DB_URL
        value: /tmp/welora_staging.db
      - key: WELORA_LLM_PROVIDER
        value: stub
      - key: WELORA_ENV
        value: staging
