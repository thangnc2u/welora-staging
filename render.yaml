# Render Blueprint — Welora Staging (P2-E2)
# Default Render Python is 3.14.3 (services after 2026-02-11) — pin 3.11.11 for wheels.
services:
  - type: web
    name: welora-staging
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: |
      export CARGO_HOME=/tmp/cargo
      export CARGO_TARGET_DIR=/tmp/cargo-target
      mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
      pip install --upgrade pip
      pip install --no-cache-dir --only-binary=:all: -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: WELORA_STORE
        value: sqlite
      # Durable data: set in the Render Dashboard to a Postgres URL (Neon / Render Postgres),
      # e.g. postgresql://…?sslmode=require. sync:false → Blueprint syncs never overwrite it.
      # Unset/sqlite path = ephemeral (reset on every deploy/restart/spin-down on Free).
      - key: WELORA_DB_URL
        sync: false
      # Mail: Render Free blocks outbound SMTP → Resend HTTP API (HTTPS 443). Set in the Dashboard:
      # WELORA_MAIL_PROVIDER "resend" + the Resend key (secret, re_…). sync:false → never overwritten.
      - key: WELORA_MAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Phone-OTP code echo (no SMS provider exists). Staging demo only: set "1" in the Dashboard
      # to show the code on /app/otp. Production must NOT set it. Unset/other → never echoed.
      - key: WELORA_OTP_ECHO
        sync: false
      # Password-reset token echo (no reset e-mail/SMS delivery yet). Staging demo only: "1" in the
      # Dashboard. Production must NOT set it. Unset/other → never echoed.
      - key: WELORA_RESET_ECHO
        sync: false
      # Optional auth rate limits (defaults: window 900 s, 5/target, 20/IP; verify 10/target, 40/IP;
      # register uses the 5/20 defaults): WELORA_RL_WINDOW_S, WELORA_RL_TARGET_MAX, WELORA_RL_IP_MAX,
      # WELORA_RL_VERIFY_TARGET_MAX, WELORA_RL_VERIFY_IP_MAX — set in the Dashboard only if needed.
      # /auth/login counts FAILED attempts only (shared demo accounts never lock): per account+IP
      # WELORA_RL_LOGIN_PAIR_MAX (10), per account from all IPs WELORA_RL_LOGIN_ACCOUNT_MAX (50),
      # per IP across accounts WELORA_RL_LOGIN_IP_MAX (30). "Account" = the resolved user (email and
      # phone share one budget); a login sending both email and phone is rejected (400).
      # Client IP for limits: CF-Connecting-IP → True-Client-IP → first X-Forwarded-For → peer, headers
      # trusted only when the TCP peer is a private/loopback proxy (Render behind Cloudflare).
      # Login-token lifetime (P0 follow-up): WELORA_TOKEN_TTL_DAYS (default 30) for password / OTP /
      # e-mail-OTP / demo tokens; WELORA_DEVICE_TOKEN_TTL_DAYS for guest /auth/device tokens (defaults
      # to WELORA_TOKEN_TTL_DAYS). Legacy tokens without expires_at get max(created_at+TTL, now+7d).
      # Guest/partner demo (P1–P6 auto-seed on startup, /auth/demo, /auth/device guests):
      # WELORA_GUEST_DEMO unset = ON (staging). PRODUCTION MUST SET WELORA_GUEST_DEMO=0 and must NOT set
      # WELORA_OTP_ECHO, WELORA_RESET_ECHO or WELORA_OTP_FIXED. WELORA_DEMO_AUTOSEED=0 disables only the
      # startup seed (also never runs when WELORA_ENV=production). POST /auth/demo/seed is admin+2FA
      # only and 404 in production; /app/login reads GET /auth/demo/accounts and never seeds.
      # WELORA_DEBUG_PRERULE is no longer read: /app/pre-rule is a regular (login-gated) page.
      - key: WELORA_LLM_PROVIDER
        value: xai
      - key: WELORA_CONTENT_ROOT
        value: content
      - key: WELORA_ENV
        value: staging
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: CARGO_TARGET_DIR
        value: /tmp/cargo-target
