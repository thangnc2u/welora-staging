<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · Chat với Agent</title>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:#0b0f14;color:#e8eef7;margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto;display:flex;flex-direction:column;height:100vh;box-sizing:border-box}
#log{flex:1;overflow:auto;background:#141b24;border-radius:12px;padding:12px;border:1px solid #243041}
.msg{margin:8px 0;padding:10px;border-radius:10px;max-width:90%}.user{background:#1e3a5f;margin-left:auto}.bot{background:#1a2332}
.deny{border-left:3px solid #ff6b6b}.pass{border-left:3px solid #3dd68c}
form{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:12px;border-radius:10px;border:1px solid #243041;background:#0b0f14;color:#e8eef7}
button{padding:12px 16px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-weight:600}
button:disabled{opacity:.55}
.muted{color:#8b9bb4;font-size:12px}
#suggestChips{display:none;flex-wrap:wrap;gap:8px;margin:8px 0 0}
#suggestChips.show{display:flex}
#suggestChips button{margin:0;padding:8px 10px;width:auto;background:#243041;color:#e8eef7;border:1px solid #334155;border-radius:999px;font-size:12px}
#denyCta{display:none;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#2a1518;border:1px solid #ff6b6b;color:#ffb4b4;text-decoration:none;font-weight:600}
#denyCta.show{display:block}
#typing{display:none;align-items:center;gap:8px;margin:8px 0;color:#8b9bb4;font-size:13px}
#typing.show{display:flex}
#typing .dots span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:99px;background:#8b9bb4;animation:blink 1s infinite}
#typing .dots span:nth-child(2){animation-delay:.15s}
#typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style></head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Chat với Agent</h1>
<p class="muted">Từ chối cứng trước tư vấn · An Toàn ≥ 3 tháng</p>
<a id="denyCta" href="/app/content?key=SAFE-02">Đọc nguyên tắc An Toàn</a>
<div id="log"></div>
<div id="suggestChips" aria-label="Gợi ý sau Cổng"></div>
<div id="typing" aria-live="polite" aria-busy="false">
  <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
  <span id="typingText">Đang soạn…</span>
</div>
<form id="f"><input id="q" placeholder="Hỏi Welora…" autocomplete="off"/><button id="sendBtn" type="submit">Gửi</button></form>
<script>
const log=document.getElementById('log');
const denyCta=document.getElementById('denyCta');
const typing=document.getElementById('typing');
const sendBtn=document.getElementById('sendBtn');
let uid=null;
const add=(t,cls)=>{const d=document.createElement('div');d.className='msg '+cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;};
function setLoading(on){
  typing.classList.toggle('show', !!on);
  typing.setAttribute('aria-busy', on?'true':'false');
  sendBtn.disabled=!!on;
}
function setGate(_status){ /* badge Cổng ẩn trên chat — Founder 04/09 */ }
function pickHref(d){
  const links=d.content_links||[];
  for(const L of links){
    if(L && (L.href||L.path||L.learn_href)) return L.href||L.learn_href||L.path;
  }
  const ctas=d.cta||[];
  for(const c of ctas){
    if(c && (c.learn_href||c.href) && String(c.learn_href||c.href).indexOf('/app/content')===0)
      return c.learn_href||c.href;
  }
  const keys=d.principle_keys||[];
  if(keys.length) return '/app/content?key='+encodeURIComponent(keys[0]);
  return '/app/content?key=SAFE-02';
}
function pickDenyLabel(d){
  const links=d.content_links||[];
  for(const L of links){
    if(L && L.title) return String(L.title);
  }
  const ctas=d.cta||[];
  for(const c of ctas){
    if(c && c.title) return String(c.title);
  }
  return 'Đọc nguyên tắc An Toàn';
}
function showDenyCta(d){
  const href=pickHref(d);
  denyCta.href=href;
  denyCta.textContent=pickDenyLabel(d);
  denyCta.classList.add('show');
}
function hideDenyCta(){ denyCta.classList.remove('show'); }
function weloraDeviceId(){
  let id=localStorage.getItem('welora_device_id');
  if(!id){
    id='web-'+Math.random().toString(36).slice(2,12);
    localStorage.setItem('welora_device_id', id);
  }
  return id;
}
const suggestChips=document.getElementById('suggestChips');
const POST_PASS_CHIPS=['Quỹ khẩn cấp nên giữ thế nào?','Tiền dư sau An Toàn dùng ra sao?'];
function hideChips(){ if(suggestChips){ suggestChips.classList.remove('show'); suggestChips.replaceChildren(); } }
function showPostPassChips(){
  if(!suggestChips || log.querySelector('.msg.user')) return;
  suggestChips.replaceChildren();
  for(const label of POST_PASS_CHIPS){
    const b=document.createElement('button');
    b.type='button'; b.textContent=label;
    b.onclick=()=>{ hideChips(); document.getElementById('q').value=label; document.getElementById('f').requestSubmit(); };
    suggestChips.appendChild(b);
  }
  suggestChips.classList.add('show');
}
(async()=>{
  const r=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:weloraDeviceId()})});
  const d=await r.json(); uid=d.user_id;
  add('Sẵn sàng','bot muted');
  try{
    const g=await fetch('/users/'+encodeURIComponent(uid)+'/safety-gate');
    const gate=await g.json();
    if(gate && gate.status==='passed') showPostPassChips();
  }catch(_e){}
})();
document.getElementById('f').onsubmit=async(e)=>{
  e.preventDefault(); const q=document.getElementById('q').value.trim(); if(!q)return;
  document.getElementById('q').value=''; add(q,'user'); hideChips();
  setLoading(true);
  try{
    const r=await fetch('/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,message:q})});
    const d=await r.json();
    const cls='bot '+(d.guardrail_result==='deny'?'deny':'pass');
    let bubble=d.reply||'Không có phản hồi';
    if(d.guardrail_result==='deny') bubble=bubble+'\nTừ chối cứng';
    add(bubble, cls);
    setGate(d.safety_gate_status||'not_passed');
    if(d.guardrail_result==='deny') showDenyCta(d); else hideDenyCta();
  }catch(err){
    add('Không gửi được. Thử lại.','bot deny');
  }finally{
    setLoading(false);
  }
};
</script>
<script src="/static/shell.js" data-shell-tab="chat"></script>
</body></html>
