<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora · Mục tiêu</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<link rel="stylesheet" href="/static/money.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app);color:var(--text-primary);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
a{color:var(--link);text-decoration:none}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:12px;padding:14px;margin:10px 0;color:var(--text-primary,#F4F1E8)}
.card.sel{border-color:var(--border-focus);box-shadow:0 0 0 1px var(--border-focus)}
.label{color:var(--text-secondary);font-size:13px}
label{display:block;margin-top:10px;color:var(--text-secondary);font-size:13px}
label[for]+input,label[for]+select{margin-top:4px}
.card[tabindex="0"]:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
button:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
.val{margin-top:2px;font-weight:600}
.muted{color:var(--text-secondary);font-size:13px}
.empty{color:var(--text-secondary);margin-top:16px}
.pedia{margin-top:12px;padding-top:10px;border-top:1px solid var(--border-default)}
.pedia a{display:block;margin-top:6px;font-weight:600}
input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-subtle);color:var(--text-primary);margin-top:8px}
input:focus-visible,select:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
button{margin-top:8px;padding:10px 14px;border:0;border-radius:8px;background:var(--cta-primary);color:var(--cta-primary-text);font-weight:600}
button:hover{background:var(--cta-primary-hover)}button:disabled{opacity:.55}
.err{color:var(--color-danger)}
.chips{display:flex;gap:8px;margin-top:8px}
.chips button{margin:0;padding:8px 10px;background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-strong)}
.card.focus-debt{border-color:var(--color-warning);box-shadow:0 0 0 1px var(--color-warning)}
.banner{background:var(--bg-elevated);border:1px solid var(--color-warning);border-radius:12px;padding:12px;margin:10px 0;color:var(--gold-300);font-size:14px}
.badge-done{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--success-bg,#143028);color:var(--success-text,#A8E6C8);border:1px solid var(--color-success,#3DB88A);font-size:12px;font-weight:700}
</style>
</head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Mục tiêu</h1>
    <nav class="ops-tabs" id="opsCluster" aria-label="Điều hành · module">
    <a class="ops-nav" id="opsNavHub" href="/app">Điều khiển</a>
    <a class="ops-nav is-active" id="opsNavGoals" href="/app/goals" aria-current="page">Mục tiêu</a>
    <a class="ops-nav" id="opsNavAccounts" href="/app/accounts">Tài khoản</a>
    <a class="ops-nav" id="opsNavTransactions" href="/app/transactions">Giao dịch</a>
    <a class="ops-nav" id="opsNavCategories" href="/app/categories">Danh mục</a>
    <a class="ops-nav" id="opsNavBudget" href="/app/budget">Ngân sách</a>
  </nav>
<p class="muted">Quỹ khẩn cấp 3 tháng · Trả nợ nguy hiểm</p>
<div class="banner" id="debtFocusBanner" hidden>Bạn đã khai nợ nguy hiểm — tạo mục tiêu trả nợ</div>
<div id="goalList" role="list" aria-label="Danh sách mục tiêu"></div>
<div class="card" id="debtBox" role="region" aria-labelledby="debtBoxLabel">
  <div class="label" id="debtBoxLabel">Tạo mục tiêu trả nợ</div>
  <p class="muted" id="debtAlready" hidden>Đã có mục tiêu trả nợ — dùng Cộng tiến độ bên dưới.</p>
  <form id="debtForm" aria-labelledby="debtBoxLabel" onsubmit="return false;">
    <label for="debtTitle">Tên mục tiêu (tùy chọn)</label>
    <input id="debtTitle" name="debtTitle" type="text" placeholder="Tên (tùy chọn)" autocomplete="off"/>
    <label for="debtSubtype">Loại nợ (tùy chọn)</label>
    <input id="debtSubtype" name="debtSubtype" type="text" placeholder="Loại nợ (tùy chọn)" autocomplete="off"/>
    <label for="debtTarget">Số tiền cần trả</label>
    <input id="debtTarget" name="debtTarget" type="text" inputmode="numeric" placeholder="Số tiền cần trả" aria-describedby="debtErr" autocomplete="off"/>
    <div class="chips" id="debtChips" role="group" aria-label="Gợi ý số tiền trả nợ">
      <button type="button" data-vnd="5000000" aria-label="Đặt 5 triệu">5tr</button>
      <button type="button" data-vnd="10000000" aria-label="Đặt 10 triệu">10tr</button>
      <button type="button" data-vnd="20000000" aria-label="Đặt 20 triệu">20tr</button>
    </div>
    <button type="button" id="debtCreateBtn">Tạo trả nợ</button>
    <p class="err" id="debtErr" role="alert" aria-live="polite"></p>
  </form>
</div>
<div class="card" id="addBox" role="region" aria-labelledby="addBoxLabel">
  <div class="label" id="addBoxLabel">Cộng tiến độ</div>
  <p class="muted" id="addHint"></p>
  <form id="progressForm" aria-labelledby="addBoxLabel" onsubmit="return false;">
    <label for="goalPick">Chọn mục tiêu</label>
    <select id="goalPick" name="goalPick" aria-describedby="addHint"></select>
    <label for="addAmount" id="addAmountLabel">Số tiền cộng / đã trả</label>
    <input id="addAmount" name="addAmount" type="text" inputmode="numeric" placeholder="Số đã trả hướng mục tiêu" aria-describedby="addHint addErr" autocomplete="off"/>
    <div class="chips" id="addChips" role="group" aria-label="Gợi ý số tiền cộng tiến độ">
      <button type="button" data-vnd="5000000" aria-label="Cộng 5 triệu">5tr</button>
      <button type="button" data-vnd="10000000" aria-label="Cộng 10 triệu">10tr</button>
      <button type="button" data-vnd="20000000" aria-label="Cộng 20 triệu">20tr</button>
    </div>
    <button type="button" id="addBtn">Cộng tiền</button>
    <p class="err" id="addErr" role="alert" aria-live="polite"></p>
  </form>
</div>
<script src="/static/money.js"></script>
<script>
const KEY='welora_device_id';
let lastId='';
let uid='';
const goalsById={};
const DEBT_409='Bạn đã có mục tiêu trả nợ. Chọn mục tiêu ở phần Cộng tiến độ để ghi trả.';
function deviceId(){
  let d=localStorage.getItem(KEY);
  if(!d){d='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY,d);}
  return d;
}
function money(n){ return (window.WeloraMoney?WeloraMoney.formatVnd(n):String(n)); }
function pct(n){ return (window.WeloraMoney?WeloraMoney.formatPct(n):String(n)); }
async function readErr(r, fallback){
  try{
    const b=await r.json();
    return b.detail||b.error||b.message||fallback;
  }catch(_e){ return fallback; }
}
function selectedGoal(){
  const id=document.getElementById('goalPick').value||lastId;
  return goalsById[id]||null;
}
function setProgressEnabled(on){
  const btn=document.getElementById('addBtn');
  const amt=document.getElementById('addAmount');
  const sel=document.getElementById('goalPick');
  btn.disabled=!on;
  amt.disabled=!on;
  sel.disabled=!on;
  document.querySelectorAll('#addChips button').forEach(function(b){ b.disabled=!on; });
}
function emptyProgressHint(){
  var n=WeloraMoney.parseVnd(document.getElementById('debtTarget').value);
  if(n>0) return 'Bấm Tạo trả nợ phía trên trước.';
  return 'Tạo quỹ khẩn cấp hoặc mục tiêu trả nợ trước khi cộng tiến độ.';
}
function hasDebtGoal(items){
  if(items&&items.some(function(g){ return g.type==='debt_payoff'; })) return true;
  return Object.keys(goalsById).some(function(k){ return goalsById[k].type==='debt_payoff'; });
}
function syncDebtBox(items){
  const form=document.getElementById('debtForm');
  const note=document.getElementById('debtAlready');
  const hide=hasDebtGoal(items);
  form.hidden=hide;
  note.hidden=!hide;
}
function syncAddUi(){
  const btn=document.getElementById('addBtn');
  const hint=document.getElementById('addHint');
  const amt=document.getElementById('addAmount');
  const g=selectedGoal();
  if(!g){
    setProgressEnabled(false);
    btn.textContent='Cộng tiền';
    hint.textContent=emptyProgressHint();
    if(amt) amt.placeholder='Số đã trả hướng mục tiêu';
    return;
  }
  if(amt){
    amt.placeholder=(g.type==='debt_payoff')?'Số đã trả hướng mục tiêu':'Số tiền cộng';
  }
  if(g.status==='completed'){
    setProgressEnabled(false);
    btn.textContent='Đã hoàn thành';
    hint.textContent='Mục tiêu đã hoàn thành — không cộng thêm.';
    return;
  }
  setProgressEnabled(true);
  btn.textContent=(g.type==='debt_payoff')?'Ghi trả nợ':'Cộng vào quỹ';
  hint.textContent='Đang cập nhật: '+(g.title||typeLabel(g.type));
}
function pediaKeys(t){
  if(t==='debt_payoff') return ['DEBT-01','DEBT-02','DEBT-03'];
  if(t==='emergency_fund') return ['SAFE-01'];
  return [];
}
function showEmpty(){
  const box=document.getElementById('goalList');
  box.textContent='';
  const p=document.createElement('p');
  p.className='empty';
  p.textContent='Chưa có quỹ khẩn cấp';
  const a=document.createElement('a');
  a.id='ctaOnboarding';
  a.href='/app/onboarding';
  a.textContent='Đi Bắt đầu để tạo quỹ 3 tháng';
  box.appendChild(p);
  box.appendChild(a);
  lastId='';
  fillPick([]);
  syncDebtBox([]);
}
function line(label,value,asMoney){
  const wrap=document.createElement('div');
  wrap.style.marginTop='8px';
  const l=document.createElement('div');
  l.className='label';
  l.textContent=label;
  const v=document.createElement('div');
  v.className='val';
  if(value===null||value===undefined) v.textContent='—';
  else v.textContent=asMoney?money(value):String(value);
  wrap.appendChild(l);
  wrap.appendChild(v);
  return wrap;
}
function typeLabel(t){
  if(t==='debt_payoff') return 'Trả nợ';
  if(t==='emergency_fund') return 'Quỹ khẩn cấp';
  return t||'—';
}
function excerpt(md){
  let s=String(md||'').replace(/^#+\s*/gm,'').replace(/[*_`]/g,' ');
  s=s.replace(/\s+/g,' ').trim();
  if(s.length<=220) return s;
  return s.slice(0,220).replace(/\s+\S*$/,'')+'…';
}
function fillPedia(box, keys){
  box.textContent='';
  const h=document.createElement('div');
  h.className='label';
  h.textContent='Học thêm';
  box.appendChild(h);
  keys.forEach(key=>{
    const row=document.createElement('div');
    row.style.marginTop='8px';
    const t=document.createElement('div');
    t.className='val';
    t.textContent='Đang tải…';
    const ex=document.createElement('p');
    ex.className='muted';
    ex.textContent='';
    const full=document.createElement('a');
    full.href='/app/content?key='+encodeURIComponent(key);
    full.textContent='Xem đầy đủ';
    const ac=document.createElement('a');
    ac.href='/app/academy?from=pedia&key='+encodeURIComponent(key);
    ac.textContent='Học sâu hơn · Welorademy';
    row.appendChild(t);
    row.appendChild(ex);
    row.appendChild(full);
    row.appendChild(ac);
    box.appendChild(row);
    fetch('/content/'+encodeURIComponent(key)).then(r=>r.json()).then(d=>{
      if(!d || d.ok===false){
        t.textContent='Bài học';
        ex.textContent='Chưa có bài.';
        return;
      }
      t.textContent=d.title||'Bài học';
      ex.textContent=excerpt(d.body_markdown||'');
      if(d.href) full.href=d.href;
    }).catch(()=>{
      t.textContent='Bài học';
      ex.textContent='Không tải được bài.';
    });
  });
}
function fillPick(items){
  const sel=document.getElementById('goalPick');
  sel.textContent='';
  (items||[]).forEach((g,i)=>{
    const o=document.createElement('option');
    o.value=g.goal_id||'';
    o.textContent=g.title||typeLabel(g.type);
    if((g.goal_id||'')===lastId || (!lastId && i===0)) o.selected=true;
    sel.appendChild(o);
  });
  if(sel.value) lastId=sel.value;
  syncAddUi();
}
function renderItems(items){
  const box=document.getElementById('goalList');
  box.textContent='';
  Object.keys(goalsById).forEach(k=>delete goalsById[k]);
  if(!items||!items.length){showEmpty();return;}
  const hasEf=items.some(g=>g.type==='emergency_fund');
  if(!hasEf){
    const p=document.createElement('p');
    p.className='empty';
    p.textContent='Chưa có quỹ khẩn cấp';
    const a=document.createElement('a');
    a.id='ctaOnboarding';
    a.href='/app/onboarding';
    a.textContent='Đi Bắt đầu để tạo quỹ 3 tháng';
    box.appendChild(p);
    box.appendChild(a);
  }
  if(!lastId || !items.some(g=>g.goal_id===lastId)) lastId=items[0].goal_id||'';
  items.forEach(g=>{
    if(g.goal_id) goalsById[g.goal_id]=g;
    const el=document.createElement('div');
    el.className='card'+(g.goal_id===lastId?' sel':'');
    el.setAttribute('data-gid', g.goal_id||'');
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    el.setAttribute('aria-pressed', g.goal_id===lastId?'true':'false');
    el.setAttribute('aria-label', (g.title||typeLabel(g.type)));
    const tgt=g.target||{};
    const cur=g.current||{};
    const isDebt=g.type==='debt_payoff';
    el.appendChild(line(isDebt?'Tên mục tiêu':'Tên quỹ', g.title));
    el.appendChild(line('Loại', typeLabel(g.type)));
    if(g.status==='completed'){
      const badge=document.createElement('div');
      badge.className='badge-done';
      badge.textContent='Hoàn thành';
      el.appendChild(badge);
    }
    if(isDebt){
      el.appendChild(line('Số cần trả', tgt.amount, true));
      el.appendChild(line('Đã trả', cur.amount, true));
      el.appendChild(line('Phần trăm', pct(cur.percent)));
    }else{
      el.appendChild(line('Tháng chi mục tiêu', tgt.months_of_expense));
      el.appendChild(line('Số dư hiện tại', cur.amount, true));
      el.appendChild(line('Phần trăm', pct(cur.percent)));
      el.appendChild(line('Tháng chi hiện tại', cur.months_covered));
    }
    const ped=document.createElement('div');
    ped.className='pedia';
    fillPedia(ped, pediaKeys(g.type));
    el.appendChild(ped);
    function selectGoalCard(){
      lastId=g.goal_id||lastId;
      document.getElementById('goalPick').value=lastId;
      box.querySelectorAll('.card').forEach(function(c){
        c.classList.remove('sel');
        c.setAttribute('aria-pressed','false');
      });
      el.classList.add('sel');
      el.setAttribute('aria-pressed','true');
      syncAddUi();
    }
    el.addEventListener('click', selectGoalCard);
    el.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); selectGoalCard(); }
    });
    box.appendChild(el);
  });
  fillPick(items);
  syncDebtBox(items);
}
async function loadList(){
  const lr=await fetch('/goals?user_id='+encodeURIComponent(uid));
  const data=await lr.json();
  renderItems(data.items||[]);
}
WeloraMoney.bindMoneyInput(document.getElementById('debtTarget'));
WeloraMoney.bindMoneyInput(document.getElementById('addAmount'));
WeloraMoney.bindChips(document.getElementById('debtChips'), document.getElementById('debtTarget'));
WeloraMoney.bindChips(document.getElementById('addChips'), document.getElementById('addAmount'));
document.getElementById('goalPick').addEventListener('change',()=>{
  lastId=document.getElementById('goalPick').value||lastId;
  syncAddUi();
});
document.getElementById('debtTarget').addEventListener('input',()=>{ if(!selectedGoal()) syncAddUi(); });
document.getElementById('debtCreateBtn').addEventListener('click', async()=>{
  const err=document.getElementById('debtErr');
  const btn=document.getElementById('debtCreateBtn');
  err.textContent='';
  const target=WeloraMoney.parseVnd(document.getElementById('debtTarget').value);
  if(!(target>0)){err.textContent='Nhập số tiền cần trả > 0';return;}
  const payload={user_id:uid,type:'debt_payoff',target_amount:target};
  const title=document.getElementById('debtTitle').value.trim();
  const subtype=document.getElementById('debtSubtype').value.trim();
  if(title) payload.title=title;
  if(subtype) payload.subtype=subtype;
  if(btn.disabled) return;
  btn.disabled=true;
  try{
    const r=await fetch('/goals',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(r.status===409){
      err.textContent=DEBT_409;
      await loadList();
      return;
    }
    if(!r.ok){ err.textContent=await readErr(r,'Không tạo được mục tiêu trả nợ'); return; }
    const body=await r.json();
    lastId=body.goal_id||(body.goal&&body.goal.goal_id)||lastId;
    document.getElementById('debtTitle').value='';
    document.getElementById('debtSubtype').value='';
    document.getElementById('debtTarget').value='';
    await loadList();
    const sel=document.getElementById('goalPick');
    if(lastId) sel.value=lastId;
    syncAddUi();
  }catch(_e){
    err.textContent='Không tạo được mục tiêu trả nợ';
  }finally{
    btn.disabled=false;
  }
});
document.getElementById('addBtn').addEventListener('click', async()=>{
  const err=document.getElementById('addErr');
  const btn=document.getElementById('addBtn');
  err.textContent='';
  if(btn.disabled) return;
  const n=WeloraMoney.parseVnd(document.getElementById('addAmount').value);
  const gid=document.getElementById('goalPick').value||lastId;
  const gSel=goalsById[gid]||selectedGoal();
  if(gSel && gSel.status==='completed'){err.textContent='Mục tiêu đã hoàn thành — không cộng thêm.';return;}
  if(!(n>0)||!gid){err.textContent='Chọn mục tiêu và nhập số > 0';return;}
  btn.disabled=true;
  try{
    const r=await fetch('/goals/'+encodeURIComponent(gid)+'/progress',{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({add_amount:n})
    });
    if(!r.ok){ err.textContent=await readErr(r,'Không cộng được tiền'); return; }
    document.getElementById('addAmount').value='';
    lastId=gid;
    await loadList();
  }catch(_e){
    err.textContent='Không cộng được tiền';
  }finally{
    if(selectedGoal()) btn.disabled=false;
  }
});
function applyDebtFocus(){
  const q=new URLSearchParams(location.search);
  const hash=(location.hash||'').replace(/^#/,'');
  if(q.get('focus')!=='debt' && hash!=='debtForm') return;
  const banner=document.getElementById('debtFocusBanner');
  const box=document.getElementById('debtBox');
  const addBox=document.getElementById('addBox');
  const form=document.getElementById('debtForm');
  const hasDebt=hasDebtGoal();
  if(banner){
    banner.hidden=false;
    banner.textContent=hasDebt
      ? 'Đã có mục tiêu trả nợ — dùng Cộng tiến độ bên dưới.'
      : 'Bạn đã khai nợ nguy hiểm — tạo mục tiêu trả nợ';
  }
  if(hasDebt){
    if(box) box.classList.remove('focus-debt');
    if(addBox){
      addBox.classList.add('focus-debt');
      try{ addBox.scrollIntoView({behavior:'smooth',block:'start'}); }catch(_e){ addBox.scrollIntoView(); }
    }
    const debtId=Object.keys(goalsById).find(function(k){ return goalsById[k].type==='debt_payoff'; });
    if(debtId){
      lastId=debtId;
      const sel=document.getElementById('goalPick');
      if(sel) sel.value=debtId;
      syncAddUi();
    }
    const input=document.getElementById('addAmount');
    if(input && !input.disabled) try{ input.focus(); }catch(_e){}
    return;
  }
  if(box){
    box.classList.add('focus-debt');
    try{ box.scrollIntoView({behavior:'smooth',block:'start'}); }catch(_e){ box.scrollIntoView(); }
  }
  if(form && !form.hidden){
    const input=document.getElementById('debtTarget');
    if(input) try{ input.focus(); }catch(_e){}
  }
}
(async()=>{
  try{
    const auth=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId()})});
    const a=await auth.json();
    uid=a.user_id||a.user||'';
    await loadList();
    applyDebtFocus();
  }catch(e){
    showEmpty();
    applyDebtFocus();
  }
})();
</script>
<script src="/static/shell.js" data-shell-tab="ops"></script>
</body>
</html>
