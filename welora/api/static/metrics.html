<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welora Metrics</title>
<style>
body{font-family:system-ui;background:#0b0f14;color:#e8eef7;margin:0;padding:16px;max-width:480px;margin-inline:auto}
a{color:#7dd3fc;text-decoration:none}
.card{background:#141b24;border:1px solid #243041;border-radius:12px;padding:14px;margin:10px 0}
.label{color:#8b9bb4;font-size:13px}
.val{font-size:1.6rem;font-weight:700;margin-top:4px}
.err{color:#ff6b6b}
</style>
</head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Metrics</h1>
<p class="label">Hard Deny không gọi LLM · deny_with_llm_calls phải = 0</p>
<div class="card"><div class="label">deny_with_llm_calls</div><div class="val" id="mDenyLlm">—</div></div>
<div class="card"><div class="label">gate_months</div><div class="val" id="mGateMonths">—</div></div>
<div class="card"><div class="label">hard_deny</div><div class="val" id="mHardDeny">—</div></div>
<div class="card"><div class="label">chat_total</div><div class="val" id="mChatTotal">—</div></div>
<div class="card"><div class="label">deny_total</div><div class="val" id="mDenyTotal">—</div></div>
<p class="err" id="mErr"></p>
<script>
(async()=>{
  try{
    const r=await fetch('/metrics');
    const d=await r.json();
    document.getElementById('mDenyLlm').textContent=String(d.deny_with_llm_calls??'—');
    document.getElementById('mGateMonths').textContent=String(d.gate_months??'—');
    document.getElementById('mHardDeny').textContent=String(d.hard_deny??'—');
    document.getElementById('mChatTotal').textContent=String(d.chat_total??'—');
    document.getElementById('mDenyTotal').textContent=String(d.deny_total??'—');
  }catch(e){
    document.getElementById('mErr').textContent='Không đọc được metrics';
  }
})();
</script>
</body>
</html>
