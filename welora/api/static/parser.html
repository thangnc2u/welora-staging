<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welora · Sao kê CSV ngân hàng</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 16px; background: #f6f7f9; }
    h1 { font-size: 1.2rem; }
    textarea { width: 100%; min-height: 140px; font-size: 13px; border-radius: 10px; border: 1px solid #e5e7eb; padding: 10px; box-sizing: border-box; }
    button { background: #0f766e; color: #fff; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 700; width: 100%; margin-top: 10px; }
    button:disabled { background: #9ca3af; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin-top: 14px; border: 1px solid #e5e7eb; }
    .muted { color: #6b7280; font-size: 13px; }
    .err { color: #b91c1c; }
    a { color: #0f766e; }
    #categories, #budgetLines { list-style: none; padding: 0; margin: 8px 0 0; }
    #categories li, #budgetLines li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
  </style>
</head>
<body>
  <p><a id="navHome" href="/app">← Welora</a></p>
  <p><a href="/app/safety">← An Toàn</a></p>
  <h1>Sao kê CSV ngân hàng</h1>
  <p class="muted">Gợi ý chi tiêu thiết yếu · <strong>không</strong> ghi đè quỹ/DNA tự động, không bỏ qua Cổng.</p>
  <textarea id="csv" placeholder="Dán CSV (date,amount,description)…"></textarea>
  <button id="go">Phân tích</button>
  <div id="out">
    <div class="card">
      <p class="muted">Gợi ý chi tiêu thiết yếu / tháng</p>
      <div id="suggestionEssential">—</div>
    </div>
    <div class="card">
      <p class="muted">Danh mục</p>
      <ul id="categories"></ul>
    </div>
    <div class="card" id="goalDraft">
      <p class="muted">Gợi ý quỹ khẩn cấp 3 tháng</p>
      <div id="goalDraftText">—</div>
      <p class="muted" id="goalExistingNote"></p>
      <button type="button" id="createGoalBtn" disabled>Tạo quỹ khẩn cấp</button>
    </div>
    <div class="card" id="budgetDraft">
      <p class="muted">Ngân sách theo danh mục</p>
      <ul id="budgetLines"></ul>
      <p class="muted" id="budgetNote"></p>
      <button type="button" id="budgetApplyBtn" disabled>Tạo / cập nhật ngân sách</button>
    </div>
  </div>
  <script>
    const KEY = 'welora_device_id';
    let draftEssential = 0;
    let existingGoal = null;
    let budgetDraft = null;
    let existingBudget = null;
    function deviceId(){
      let d = localStorage.getItem(KEY);
      if(!d){ d = 'dev-' + Math.random().toString(36).slice(2,10); localStorage.setItem(KEY, d); }
      return d;
    }
    function vnd(n){ return Number(n||0).toLocaleString('vi-VN') + ' đ'; }
    const sample = `date,amount,description\n01/07/2026,-3500000,Thuê nhà tháng 7\n05/07/2026,-450000,Điện EVN\n10/07/2026,25000000,Lương\n12/07/2026,-1200000,WinMart\n15/07/2026,-2000000,Học phí\n01/08/2026,-3500000,Thuê nhà tháng 8\n10/08/2026,25000000,Lương`;
    document.getElementById('csv').value = sample;
    document.getElementById('go').onclick = async () => {
      const text = document.getElementById('csv').value;
      const suggestionEl = document.getElementById('suggestionEssential');
      const catEl = document.getElementById('categories');
      const draftEl = document.getElementById('goalDraftText');
      const noteEl = document.getElementById('goalExistingNote');
      const btn = document.getElementById('createGoalBtn');
      suggestionEl.textContent = '…';
      catEl.textContent = '';
      draftEl.textContent = '—';
      noteEl.textContent = '';
      btn.disabled = true;
      existingGoal = null;
      budgetDraft = null;
      existingBudget = null;
      const bLines = document.getElementById('budgetLines');
      const bNote = document.getElementById('budgetNote');
      const bBtn = document.getElementById('budgetApplyBtn');
      bLines.textContent = '';
      bNote.textContent = '';
      bBtn.disabled = true;
      try {
        const r = await fetch('/parser/csv', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, filename: 'paste.csv' }),
        });
        const j = await r.json();
        if (!r.ok || !j.ok) {
          suggestionEl.textContent = (j.error || r.statusText) + ' ' + (j.hint || '');
          return;
        }
        const s = j.suggestion || {};
        const n = Number(s.essential_expense_monthly || 0);
        suggestionEl.textContent = vnd(n);
        const counts = j.category_counts || {};
        const keys = Object.keys(counts);
        if (!keys.length) {
          const li = document.createElement('li');
          li.className = 'muted';
          li.textContent = 'Không có danh mục';
          catEl.appendChild(li);
        } else {
          keys.forEach((k) => {
            const li = document.createElement('li');
            const a = document.createElement('span');
            a.textContent = k;
            const b = document.createElement('span');
            b.textContent = String(counts[k]);
            li.appendChild(a);
            li.appendChild(b);
            catEl.appendChild(li);
          });
        }
        const gd = j.goal_draft || {};
        draftEssential = Number(gd.essential_expense_monthly || n || 0);
        const target = Number(gd.target_amount || (draftEssential * 3) || 0);
        draftEl.textContent = 'Chi tiêu/tháng: ' + vnd(draftEssential) + ' · Mục tiêu 3 tháng: ' + vnd(target);
        const auth = await fetch('/auth/device', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: deviceId() }),
        });
        const a = await auth.json();
        const uid = a.user_id || '';
        const gl = await fetch('/goals?user_id=' + encodeURIComponent(uid));
        const gj = await gl.json();
        const items = gj.items || gj.goals || [];
        existingGoal = items.find((g) => (g.type || '') === 'emergency_fund') || null;
        if (existingGoal) {
          const cur = (existingGoal.current && existingGoal.current.amount) || existingGoal.current_amount || 0;
          const tgt = (existingGoal.target && existingGoal.target.amount) || existingGoal.target_amount || 0;
          noteEl.textContent = 'Quỹ đã có · không ghi đè. Hiện tại ' + vnd(cur) + ' / mục tiêu ' + vnd(tgt);
          btn.disabled = true;
        } else if (draftEssential > 0) {
          btn.disabled = false;
        }
        budgetDraft = j.budget_draft || null;
        const lines = (budgetDraft && budgetDraft.lines) || [];
        if (!lines.length) {
          const li = document.createElement('li');
          li.className = 'muted';
          li.textContent = 'Chưa có dòng ngân sách';
          bLines.appendChild(li);
        } else {
          lines.forEach((row) => {
            const li = document.createElement('li');
            const a = document.createElement('span');
            a.textContent = row.category || '';
            const b = document.createElement('span');
            b.textContent = String(row.count || 0) + ' · ' + vnd(row.outflow || 0);
            li.appendChild(a);
            li.appendChild(b);
            bLines.appendChild(li);
          });
        }
        const br = await fetch('/budget?user_id=' + encodeURIComponent(uid));
        const bj = await br.json();
        existingBudget = (bj && bj.budget) || null;
        if (existingBudget) {
          bNote.textContent = 'Ngân sách đã có · không ghi đè im lặng.';
          bBtn.disabled = false;
        } else if (lines.length) {
          bBtn.disabled = false;
        }
      } catch (e) {
        suggestionEl.textContent = String(e.message || e);
      }
    };
    document.getElementById('createGoalBtn').onclick = async () => {
      if (existingGoal || draftEssential <= 0) return;
      const auth = await fetch('/auth/device', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId() }),
      });
      const a = await auth.json();
      const uid = a.user_id || '';
      await fetch('/goals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: uid,
          type: 'emergency_fund',
          essential_expense_monthly: draftEssential,
          current_amount: 0,
        }),
      });
      document.getElementById('goalExistingNote').textContent = 'Đã tạo quỹ khẩn cấp 3 tháng.';
      document.getElementById('createGoalBtn').disabled = true;
    };
    document.getElementById('budgetApplyBtn').onclick = async () => {
      if (!budgetDraft || !(budgetDraft.lines || []).length) return;
      const auth = await fetch('/auth/device', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId() }),
      });
      const a = await auth.json();
      const uid = a.user_id || '';
      const r = await fetch('/budget', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: uid,
          confirm: true,
          replace_existing: !!existingBudget,
          draft: budgetDraft,
        }),
      });
      const note = document.getElementById('budgetNote');
      if (!r.ok) {
        note.textContent = 'Ngân sách đã có · không ghi đè im lặng.';
        return;
      }
      note.textContent = existingBudget ? 'Đã cập nhật ngân sách.' : 'Đã lưu ngân sách.';
      existingBudget = (await r.json()).budget || existingBudget;
      document.getElementById('budgetApplyBtn').disabled = true;
    };
  </script>
</body>
</html>
