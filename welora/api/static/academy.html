<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Welora · Welorademy</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app,#121A28);color:var(--text-primary,#F4F1E8);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
a{color:var(--link,#E8C86A);text-decoration:none}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:12px;padding:14px;margin:10px 0;color:var(--text-primary,#F4F1E8)}
.card.openable{cursor:pointer}
.muted{color:var(--text-secondary,#A8B0C0);font-size:13px}
button,.btn-primary{display:block;box-sizing:border-box;margin-top:8px;padding:10px 14px;border:0;border-radius:8px;background:var(--cta-primary,#D4AF37);color:var(--cta-primary-text,#121A28);font-weight:600;width:100%;text-align:center;text-decoration:none}
button:hover{background:var(--cta-primary-hover,#E8C86A)}button:active{background:var(--cta-primary-pressed,#B8922E)}
button:disabled{opacity:.55}
.status{font-size:12px;color:var(--text-secondary,#A8B0C0)}
.tag{display:inline-block;background:var(--bg-elevated,#243044);color:var(--text-secondary,#A8B0C0);font-weight:600;font-size:11px;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:middle;border:1px solid var(--border-default,#2F3D54)}
.card.focus{border-color:var(--border-focus,#E8C86A);box-shadow:0 0 0 1px var(--border-focus,#E8C86A)}
.nudge{display:block;margin-top:10px;background:var(--bg-elevated,#243044);border:1px solid var(--border-default,#2F3D54);border-radius:10px;padding:12px;color:var(--text-primary,#F4F1E8);text-decoration:none;font-weight:600}
.q{margin:10px 0}
label{display:block;margin:4px 0;color:var(--text-primary,#F4F1E8)}
#kuatOut{font-size:15px;font-weight:700;margin-top:10px}
#kuatOut.pass{color:var(--color-success,#3DB88A)}
#kuatOut.fail{color:var(--color-danger,#E85D5D)}
#kuatOut.err{color:var(--color-warning,#E8C86A)}
.modHead{font-size:16px;font-weight:700;margin:18px 0 8px;color:var(--text-primary,#F4F1E8)}
#lessonBody{font-size:15px;line-height:1.65;margin:12px 0 16px;background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:12px;padding:14px;color:var(--text-primary,#F4F1E8)}
#lessonBody h2{font-size:1.08rem;margin:16px 0 8px;font-weight:700}
#lessonBody h3{font-size:1.0rem;margin:12px 0 6px;font-weight:700}
#lessonBody p{margin:0 0 10px}
#lessonBody ul,#lessonBody ol{margin:0 0 12px;padding-left:1.3rem}
#lessonBody li{margin:4px 0}
#lessonBody hr{border:0;border-top:1px solid var(--border-default,#2F3D54);margin:14px 0}
#lessonBody code{font-size:13px;background:var(--bg-app,#121A28);padding:1px 4px;border-radius:4px}

#btnDemoReset[hidden]{display:none}

<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Welorademy</h1>
<p class="muted">Rễ Cục · An Toàn Tài Chính · Tự Do Tài Chính · Bền Vững & Di Sản · Kết Nối & Thực Hành · Học viện</p>
<p class="muted" id="kuatRule">KUAT: kết quả chỉ là ĐẠT / CHƯA ĐẠT. Đạt khi đúng từ 70% số câu trở lên và đúng mọi câu trọng tâm.</p>
<p class="muted" id="xpLine">XP —</p>
<p class="muted" id="focusLine"></p>
<button type="button" id="btnDemoReset" hidden>Reset tiến độ demo của tôi</button>
<p class="muted" id="demoResetOut"></p>
<a id="osNudge" class="btn-primary" href="/app/goals" hidden>Tạo mục tiêu trên WeloraOS</a>
<div id="tree"></div>
<div id="lesson" hidden>
  <h2 id="lessonTitle"></h2>
  <p class="muted" id="lessonStub"></p>
  <div id="lessonBody"></div>
  <p><a id="pediaLink" href="/app/content">Welorapedia</a></p>
  <button type="button" id="btnRead" class="btn-primary">Đánh dấu đã đọc</button>
  <div id="kuatBox"></div>
  <button type="button" id="btnKuat" class="btn-primary">Nộp KUAT</button>
  <p id="kuatOut"></p>
  <p><a id="backTree" href="#">← Cây</a></p>
</div>
<script src="/static/session.js"></script>
<script>
const KEY='welora_device_id';
function deviceId(){
  let d=localStorage.getItem(KEY);
  if(!d){d='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY,d);}
  return d;
}
let uid='';
let current=null;
const params=new URLSearchParams(location.search);
// deep-link support: /app/academy?from=pedia&key=
const fromPedia=params.get('from')==='pedia';
// follow-up item 2: /app/academy?node=N02-01 opens that lesson (link of the KUAT 429 notice)
const deepNode=(function(v){ v=String(v||'').toUpperCase(); return /^N0[1-5]-0[1-9]$/.test(v)?v:''; })(params.get('node'));
const focusKey=(params.get('key')||params.get('principle_key')||'').toUpperCase();
function statusVi(s){
  return s==='locked'?'khóa':s==='available'?'học':s==='learning'?'học':s==='kuat_pending'?'KUAT':s==='mastered'?'đã thành thạo':(s||'');
}
function viTag(pk){
  var k=String(pk||'');
  if(k.indexOf('SAFE-')===0) return 'An toàn';
  if(k.indexOf('DEBT-')===0) return 'Nợ';
  if(k.indexOf('CORE-')===0) return 'Cốt lõi';
  if(k.indexOf('MIND-')===0) return 'Tư duy';
  if(k.indexOf('FLOW-')===0) return 'Dòng tiền';
  if(k.indexOf('BUDG-')===0) return 'Ngân sách';
  if(k.indexOf('TRACK-')===0) return 'Theo dõi';
  if(k.indexOf('GOAL-')===0) return 'Mục tiêu';
  if(k.indexOf('TIME-')===0) return 'Thời gian';
  return '';
}
function baiLabel(nOrId){
  if(nOrId && typeof nOrId==='object'){
    if(nOrId.order!=null && nOrId.order!=='') return 'Bài '+Number(nOrId.order);
    nOrId=nOrId.node_id;
  }
  var m=String(nOrId||'').match(/-(\d+)\s*$/);
  return m?('Bài '+Number(m[1])):'';
}
function setXp(n){
  if(n==null || n==='') return;
  document.getElementById('xpLine').textContent='XP '+String(n);
}
function renderNodeCard(n, box){
  const el=document.createElement('div');
  el.className='card';
  const t=document.createElement('div');
  const b=baiLabel(n);
  if(b){
    const span=document.createElement('span');
    span.className='tag';
    span.textContent=b;
    t.appendChild(span);
  }
  t.appendChild(document.createTextNode(n.title||''));
  const s=document.createElement('div');
  s.className='status';
  const pk=viTag(n.principle_key);
  s.textContent=statusVi(n.status)+(pk?(' · '+pk):'');
  el.appendChild(t);el.appendChild(s);
  const keys=(n.core_map||[]).concat(n.principle_key||[]);
  if(fromPedia&&focusKey&&keys.indexOf(focusKey)>=0){
    el.className='card focus';
    el.id='focusNode';
  }
  if(n.status!=='locked'){
    el.classList.add('openable');
    el.setAttribute('role','button');
    el.tabIndex=0;
    el.addEventListener('click',()=>openNode(n.node_id));
    el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openNode(n.node_id);} });
  }
  box.appendChild(el);
}
function setRule(data){
  /* follow-up item 6: the KUAT line follows the server's pass rule (pass / fail only, no percent shown) */
  if(data&&typeof data.pass_rule==='string'&&data.pass_rule){
    document.getElementById('kuatRule').textContent='KUAT: kết quả chỉ là ĐẠT / CHƯA ĐẠT. '+data.pass_rule;
  }
}
/* follow-up #244/#245 item 13: only a demo login session (server: tree.demo_session) gets the button */
function setDemoReset(data){
  const b=document.getElementById('btnDemoReset');
  if(b) b.hidden=!(data&&data.demo_session===true);
}
const DEMO_RESET_CONFIRM='Đặt lại tiến độ học của phiên demo này về trạng thái ban đầu? Bài đã đọc, kết quả KUAT, XP và huy hiệu của phiên này sẽ bị xoá. Người dùng thử khác không bị ảnh hưởng.';
document.getElementById('btnDemoReset').onclick=async()=>{
  const out=document.getElementById('demoResetOut');
  if(!window.confirm(DEMO_RESET_CONFIRM)) return;
  out.textContent='';
  try{
    const r=await fetch('/academy/demo/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    let d={};
    try{ d=await r.json(); }catch(_e){ d={}; }
    if(!r.ok){ out.textContent=((d.detail&&d.detail.message)||'Không đặt lại được tiến độ. Vui lòng thử lại.'); return; }
    out.textContent=d.message||'Đã đặt lại tiến độ.';
    showTree(d.tree||{});
  }catch(_e){ out.textContent='Không kết nối được. Vui lòng thử lại.'; }
};
function showTree(data){
  setRule(data);
  setDemoReset(data);
  document.getElementById('lesson').hidden=true;
  document.getElementById('tree').hidden=false;
  const box=document.getElementById('tree');
  box.textContent='';
  setXp((data&&data.xp)||0);
  const modules=(data.modules||[]).slice().sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);});
  if(modules.length){
    modules.forEach(function(mod){
      const h=document.createElement('div');
      h.className='modHead';
      h.textContent=mod.title||mod.module_id||'';
      box.appendChild(h);
      const nodes=(mod.nodes||[]).slice().sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);});
      nodes.forEach(function(n){ renderNodeCard(n, box); });
    });
  }else{
    const byMod={};
    (data.nodes||[]).forEach(function(n){
      const mid=n.module_id||'';
      if(!byMod[mid]) byMod[mid]=[];
      byMod[mid].push(n);
    });
    Object.keys(byMod).sort().forEach(function(mid){
      const h=document.createElement('div');
      h.className='modHead';
      h.textContent=(byMod[mid][0]&&byMod[mid][0].module_title)||mid;
      box.appendChild(h);
      byMod[mid].slice().sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);}).forEach(function(n){ renderNodeCard(n, box); });
    });
  }
  const fl=document.getElementById('focusLine');
  if(fromPedia&&focusKey){
    const tag=viTag(focusKey);
    fl.textContent=tag?('Từ Welorapedia · '+tag):'Từ Welorapedia';
  }else{
    fl.textContent='';
  }
}
async function loadTree(){
  const r=await fetch('/academy/tree?user_id='+encodeURIComponent(uid));
  const d=await r.json();
  showTree(d);
  return d;
}

function stripFrontmatter(md){
  var s=String(md||'').replace(/^\uFEFF/,'');
  var idx=s.search(/\n---\s*\n/);
  if(idx>=0){
    var head=s.slice(0,idx);
    if(/principle_key|Module:|M\u1ee9c r\u1ee7i ro|Version:|Status:|^#\s*W[AP]-/m.test(head)){
      s=s.slice(idx).replace(/^\n---\s*\n/,'');
    }
  }
  var lines=s.split('\n');
  while(lines.length){
    var t=lines[0].trim();
    if(!t){ lines.shift(); continue; }
    if(/^#\s*W[AP]-/.test(t)){ lines.shift(); continue; }
    if(/^\*\*(Module|M\u1ee9c r\u1ee7i ro|Version|Status|principle_key|secondary_keys):/i.test(t)){ lines.shift(); continue; }
    break;
  }
  return lines.join('\n').replace(/^\s+/,'');
}
function isSafeHref(h){
  if(!h) return false;
  if(h.charAt(0)==='/' || h.charAt(0)==='#') return true;
  return /^https?:\/\//i.test(h);
}
function appendInline(parent, text){
  var re=/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g;
  var last=0, m;
  text=String(text||'');
  while((m=re.exec(text))){
    if(m.index>last) parent.appendChild(document.createTextNode(text.slice(last,m.index)));
    var tok=m[0];
    if(tok.slice(0,2)==='**'){
      var s=document.createElement('strong');
      s.textContent=tok.slice(2,-2);
      parent.appendChild(s);
    }else if(tok.charAt(0)==='*'){
      var e=document.createElement('em');
      e.textContent=tok.slice(1,-1);
      parent.appendChild(e);
    }else if(tok.charAt(0)==='`'){
      var c=document.createElement('code');
      c.textContent=tok.slice(1,-1);
      parent.appendChild(c);
    }else{
      var mm=tok.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if(mm && isSafeHref(mm[2])){
        var a=document.createElement('a');
        a.href=mm[2];
        a.textContent=mm[1];
        parent.appendChild(a);
      }else{
        parent.appendChild(document.createTextNode(tok));
      }
    }
    last=m.index+tok.length;
  }
  if(last<text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}
function renderMarkdown(root, md){
  root.textContent='';
  var lines=String(md||'').split('\n');
  var i=0;
  while(i<lines.length){
    var t=lines[i].trim();
    if(!t){ i++; continue; }
    if(t==='---' || t==='***'){
      root.appendChild(document.createElement('hr')); i++; continue;
    }
    if(/^###\s+/.test(t)){
      var h3=document.createElement('h3');
      appendInline(h3, t.replace(/^###\s+/,''));
      root.appendChild(h3); i++; continue;
    }
    if(/^##\s+/.test(t)){
      var h2=document.createElement('h2');
      appendInline(h2, t.replace(/^##\s+/,''));
      root.appendChild(h2); i++; continue;
    }
    if(/^#\s+/.test(t)){
      var h=document.createElement('h2');
      appendInline(h, t.replace(/^#\s+/,''));
      root.appendChild(h); i++; continue;
    }
    if(/^[-*]\s+/.test(t)){
      var ul=document.createElement('ul');
      while(i<lines.length && /^[-*]\s+/.test(lines[i].trim())){
        var li=document.createElement('li');
        appendInline(li, lines[i].trim().replace(/^[-*]\s+/,''));
        ul.appendChild(li); i++;
      }
      root.appendChild(ul); continue;
    }
    if(/^\d+\.\s+/.test(t)){
      var ol=document.createElement('ol');
      while(i<lines.length && /^\d+\.\s+/.test(lines[i].trim())){
        var li2=document.createElement('li');
        appendInline(li2, lines[i].trim().replace(/^\d+\.\s+/,''));
        ol.appendChild(li2); i++;
      }
      root.appendChild(ol); continue;
    }
    var p=document.createElement('p');
    var buf=t; i++;
    while(i<lines.length){
      var n=lines[i].trim();
      if(!n || /^#{1,3}\s/.test(n) || /^[-*]\s+/.test(n) || /^\d+\.\s+/.test(n) || n==='---') break;
      buf+=' '+n; i++;
    }
    appendInline(p, buf);
    root.appendChild(p);
  }
}

async function openNode(id){
  const r=await fetch('/academy/nodes/'+encodeURIComponent(id)+'?user_id='+encodeURIComponent(uid));
  const n=await r.json();
  current=n;
  document.getElementById('tree').hidden=true;
  document.getElementById('lesson').hidden=false;
  const bai=baiLabel(n);
  document.getElementById('lessonTitle').textContent=(bai?bai+' · ':'')+(n.title||'');
  // Never show principle_key / SAFE-* / DEBT-* in learner stub
  var stub=String(n.lesson_stub||n.title||'');
  if(/\b(SAFE|DEBT|CORE|MIND|FLOW|BUDG|TRACK|GOAL|TIME|N0\d)-/i.test(stub)) stub=n.title||'';
  document.getElementById('lessonStub').textContent=stub;
  var bodyEl=document.getElementById('lessonBody');
  renderMarkdown(bodyEl, stripFrontmatter(n.body_markdown||''));
  if(!bodyEl.textContent || bodyEl.textContent.trim().length<40){
    // plain fallback if markdown empty
    bodyEl.textContent=stripFrontmatter(n.body_markdown||stub||'');
  }
  const a=document.getElementById('pediaLink');
  a.href=n.content_href||('/app/content?key='+(n.principle_key||''));
  renderKuat(n.questions||[], n.kuat||{});
}
/* GP P0b: each KUAT is a server-issued attempt (random questions from the bank, shuffled options,
   single-use attempt_id; reloading / another tab gets the SAME open attempt). The server returns
   only ĐẠT / CHƯA ĐẠT — no score, no percent, never which question was right — and answers 429
   with a retry time after repeated failures, 409 KUAT_RELOAD for a stale page. */
function kuatErr(d, status){
  const x=(d&&d.detail!==undefined)?d.detail:d;
  if(x&&typeof x==='object') return x.message||x.error||('Không nộp được KUAT ('+status+')');
  return (typeof x==='string'&&x)?(x==='locked'?'Bài này đang khóa — hãy hoàn thành bài trước.':x):('Không nộp được KUAT ('+status+')');
}
function cooldownText(c){
  let t=(c&&c.message)||'Bạn đã thử quá nhiều lần. Vui lòng thử lại sau ít phút.';
  /* round 4: the server message already names the retry time in Vietnam time (retry_at_vn) */
  if(c&&c.retry_at&&!(c.retry_at_vn&&t.indexOf(c.retry_at_vn)>=0)){
    try{ t+=' (từ '+new Date(c.retry_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Ho_Chi_Minh'})+', giờ Việt Nam)'; }catch(_e){}
  }
  return t;
}
function showCooldown(out, c){
  out.className='err';
  out.textContent=cooldownText(c);
  const href=String((c&&c.lesson_href)||'');
  if(href.indexOf('/app/')===0&&href.charAt(5)!=='/'&&href.indexOf('\\')<0){  /* same-origin app link only */
    const a=document.createElement('a');
    a.href=href;
    a.textContent='Ôn lại bài'+((c&&c.lesson_title)?(': '+c.lesson_title):'');
    /* item 2: already on this lesson → scroll to its text instead of reloading the page.
       Follow-up #244/#245 item 11: the address bar follows (history.pushState → /app/academy?node=…),
       so reload / share / «Back» land on the same lesson; another lesson opens in place. */
    a.addEventListener('click',function(ev){
      const m=href.match(/^\/app\/(?:academy|learn)\?node=(N0[1-5]-0[1-9])$/i);
      if(!m) return;  /* not an Academy lesson link → normal navigation */
      const nid=m[1].toUpperCase();
      ev.preventDefault();
      try{ if(window.history&&history.pushState) history.pushState({node:nid},'',href); }catch(_e){}
      if(current&&String(current.node_id||'').toUpperCase()===nid){
        const b=document.getElementById('lessonBody');
        if(b&&b.scrollIntoView) b.scrollIntoView({behavior:'smooth',block:'start'});
      }else{
        openNode(nid);
      }
    });
    out.appendChild(document.createTextNode(' '));
    out.appendChild(a);
  }
}
function renderKuat(questions, kuat){
  const box=document.getElementById('kuatBox');
  const btn=document.getElementById('btnKuat');
  const out=document.getElementById('kuatOut');
  box.textContent='';
  out.textContent='';
  out.className='';
  current.attempt_id=(kuat&&kuat.attempt_id)||'';
  current.kuat_questions=questions||[];
  (questions||[]).forEach(q=>{
    const wrap=document.createElement('div');
    wrap.className='q';
    wrap.dataset.qid=q.id;
    const p=document.createElement('div');
    p.textContent=q.prompt;
    wrap.appendChild(p);
    (q.choices||[]).forEach((c,i)=>{
      const lab=document.createElement('label');
      const inp=document.createElement('input');
      inp.type='radio'; inp.name='q-'+q.id; inp.value=String(i);
      lab.appendChild(inp);
      lab.appendChild(document.createTextNode(' '+c));
      wrap.appendChild(lab);
    });
    box.appendChild(wrap);
  });
  if(kuat&&kuat.cooldown){
    showCooldown(out, kuat.cooldown);
  }
  btn.hidden=!(questions&&questions.length);
}
async function newAttempt(){
  const r=await fetch('/academy/kuat/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,node_id:current.node_id})});
  let d={};
  try{ d=await r.json(); }catch(_e){ d={}; }
  if(r.ok){ renderKuat(d.questions||[], d); return {ok:true}; }
  if(r.status===429){ renderKuat([], {cooldown:d.detail||d}); return {ok:false,cooldown:true}; }
  return {ok:false};
}
document.getElementById('btnRead').onclick=async()=>{
  if(!current || !uid) return;
  await fetch('/academy/nodes/'+encodeURIComponent(current.node_id)+'/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,node_id:current.node_id})});
};
document.getElementById('btnKuat').onclick=async()=>{
  if(!current) return;
  const btn=document.getElementById('btnKuat');
  const out=document.getElementById('kuatOut');
  if(btn.disabled) return;
  if(!uid){
    out.className='err';
    out.textContent='Thiếu phiên đăng nhập — hãy mở lại app trên thiết bị này.';
    return;
  }
  btn.disabled=true;
  out.className='';
  out.textContent='';
  try{
    const answers=[];
    let missing=0;
    document.querySelectorAll('#kuatBox .q').forEach(w=>{
      const sel=w.querySelector('input:checked');
      if(!sel) missing++;
      answers.push({question_id:w.dataset.qid,choice:sel?Number(sel.value):-1});
    });
    if(missing){
      out.className='err';
      out.textContent='Hãy chọn đáp án cho mọi câu trước khi nộp.';
      out.scrollIntoView({behavior:'smooth',block:'nearest'});
      return;
    }
    const r=await fetch('/academy/kuat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,node_id:current.node_id,attempt_id:current.attempt_id||null,answers})});
    let d={};
    try{ d=await r.json(); }catch(_e){ d={}; }
    if(!r.ok){
      if(r.status===429){
        renderKuat([], {cooldown:d.detail||d});
      }else if(r.status===409&&((d.detail||d).error_code==='KUAT_RELOAD')){
        out.className='err';
        out.textContent=kuatErr(d, r.status);
      }else if(r.status===409){
        await newAttempt();
        out.className='err';
        out.textContent=kuatErr(d, r.status)+' Đã mở lượt mới cho bạn.';
      }else{
        out.className='err';
        out.textContent=kuatErr(d, r.status);
      }
      out.scrollIntoView({behavior:'smooth',block:'nearest'});
      return;
    }
    if(d.xp!=null) setXp(d.xp);
    const kr=d.kuat_result||{};
    const passed=!!kr.passed;
    if(!passed){
      /* the attempt is used up: load a NEW random set (or the cooldown notice) */
      await newAttempt();
    }else{
      document.getElementById('kuatBox').textContent='';
      btn.hidden=true;
    }
    if(!out.textContent){
      out.className=passed?'pass':'fail';
      out.textContent=passed?'ĐẠT':'CHƯA ĐẠT — ôn lại bài rồi làm lượt mới (câu hỏi đã được đổi).';
    }else if(!passed){
      out.insertBefore(document.createTextNode('CHƯA ĐẠT — '), out.firstChild);
    }
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
    const nudge=document.getElementById('osNudge');
    const mastered=(current&&current.status==='mastered')||passed||(d.status==='mastered');
    if(d.os_nudge&&d.os_nudge.href){
      nudge.hidden=false;
      nudge.href=d.os_nudge.href;
      nudge.textContent='Tạo mục tiêu trên WeloraOS';
    }else if(!mastered){
      nudge.hidden=true;
    }
    if(passed) current.status='mastered';
  }catch(e){
    out.className='err';
    out.textContent='Không nộp được KUAT. Thử lại.';
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
  }finally{
    btn.disabled=false;
  }
};
document.getElementById('backTree').onclick=(e)=>{e.preventDefault();loadTree();};
/* item 11: «Back» after a pushState'd lesson link → the lesson of that address (or the tree) */
window.addEventListener('popstate',function(){
  const v=String(new URLSearchParams(location.search).get('node')||'').toUpperCase();
  if(/^N0[1-5]-0[1-9]$/.test(v)) openNode(v); else loadTree();
});
(async()=>{
  if(window.WeloraSession&&WeloraSession.resolveUserId){
    uid=await WeloraSession.resolveUserId();
  }else{
    const auth=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId()})});
    const a=await auth.json();
    uid=a.user_id||'';
  }
  const tree=await loadTree();
  if(deepNode){
    const hit=((tree&&tree.nodes)||[]).find(function(n){ return n.node_id===deepNode; });
    if(hit&&hit.status!=='locked') await openNode(deepNode);
  }
})();
</script>
