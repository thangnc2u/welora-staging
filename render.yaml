# Render Blueprint — Welora Staging (P2-E2)
# Default Render Python is 3.14.3 (services after 2026-02-11) — pin 3.11.11 for wheels.
services:
  - type: web
    name: welora-staging
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: |
      export CARGO_HOME=/tmp/cargo
      export CARGO_TARGET_DIR=/tmp/cargo-target
      mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
      pip install --upgrade pip
      pip install --no-cache-dir --only-binary=:all: -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: WELORA_STORE
        value: sqlite
      - key: WELORA_DB_URL
        value: /tmp/welora_staging.db
      - key: WELORA_LLM_PROVIDER
        value: xai
      - key: WELORA_CONTENT_ROOT
        value: content
      - key: WELORA_ENV
        value: staging
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: CARGO_TARGET_DIR
        value: /tmp/cargo-target
