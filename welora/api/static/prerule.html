<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="/static/auth-gate.js"></script>
<title>Pre-Rule · gỡ lỗi</title>
<link rel="stylesheet" href="/static/welora-tokens.css"/>
<link rel="stylesheet" href="/static/shell.css"/>
<style>
body{font-family:system-ui;background:var(--bg-app,#0b0f14);color:var(--text-primary,#e8eef7);margin:0;padding:16px 16px 88px;max-width:480px;margin-inline:auto}
a{color:var(--link,#7dd3fc);text-decoration:none}
.card{background:var(--bg-surface,#1A2536);border:1px solid var(--border-default,#2F3D54);border-radius:12px;padding:14px;margin:10px 0;color:var(--text-primary,#F4F1E8)}
.label{color:var(--text-secondary,#8b9bb4);font-size:13px}
.val{margin-top:4px;font-weight:600;white-space:pre-wrap}
.muted{color:var(--text-secondary,#8b9bb4);font-size:13px}
textarea{width:100%;box-sizing:border-box;min-height:88px;padding:10px;border-radius:8px;border:1px solid var(--border-default,#2F3D54);background:var(--bg-app,#0b0f14);color:var(--text-primary,#e8eef7);margin-top:8px}
button{margin-top:8px;padding:10px 14px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-weight:600;width:100%}
.err{color:var(--color-danger,#ff6b6b)}
</style>
</head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>Pre-Rule</h1>
<p class="muted">Kiểm tra một ý định tài chính với bộ quy tắc an toàn (Hard Deny) trước khi Agent trả lời. Từ chối trước LLM. Không hiện mã tài khoản.</p>
<textarea id="q" placeholder="Ví dụ: Tôi muốn tất tay ETF ngay"></textarea>
<button type="button" id="go">Chạy Pre-Rule</button>
<p class="err" id="err"></p>
<div class="card"><div class="label">Kết quả</div><div class="val" id="guardrail">—</div></div>
<div class="card"><div class="label">Luật</div><div class="val" id="ruleHit">—</div></div>
<div class="card"><div class="label">Gọi LLM</div><div class="val" id="llmCalled">—</div></div>
<div class="card"><div class="label">Cổng</div><div class="val" id="gateStatus">—</div></div>
<div class="card"><div class="label">Phản hồi</div><div class="val" id="reply">—</div></div>
<script src="/static/session.js"></script>
<script>
const KEY='welora_device_id';
function deviceId(){
  let d=localStorage.getItem(KEY);
  if(!d){d='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY,d);}
  return d;
}
function setTxt(id,v){
  document.getElementById(id).textContent=(v===undefined||v===null||v==='')?'—':String(v);
}
function resultLabel(v){
  return v==='deny'?'Từ chối cứng':(v==='pass'?'Cho qua':(v==='soft_warning'?'Cảnh báo nhẹ':(v||'')));
}
function gateLabel(v){
  return v==='passed'?'ĐẠT':(v==='not_passed'?'CHƯA ĐẠT':(v||''));
}
function yn(v){
  return v===true||v==='true'?'Có':(v===false||v==='false'?'Không':(v===undefined||v===null||v===''?'':String(v)));
}
document.getElementById('go').addEventListener('click', async()=>{
  document.getElementById('err').textContent='';
  const message=document.getElementById('q').value.trim();
  if(!message){document.getElementById('err').textContent='Nhập câu hỏi';return;}
  try{
    /* P0: logged-in welora_token first; device (guest) token only when there is none */
    let uid='';
    if(window.WeloraSession&&WeloraSession.resolveUserId){
      uid=await WeloraSession.resolveUserId();
    }else{
      const auth=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId()})});
      const a=await auth.json();
      uid=a.user_id||a.user||'';
    }
    const r=await fetch('/agent/pre-rule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,message})});
    const d=await r.json();
    if(!r.ok){
      document.getElementById('err').textContent=(r.status===401)?'Phiên đăng nhập đã hết hạn — vui lòng đăng nhập lại.':'Không chạy được Pre-Rule';
      return;
    }
    setTxt('guardrail', resultLabel(d.guardrail_result));
    setTxt('ruleHit', d.rule_hit);
    setTxt('llmCalled', yn(d.should_call_llm));
    setTxt('gateStatus', gateLabel(d.safety_gate_status));
    setTxt('reply', d.reply);
  }catch(e){
    document.getElementById('err').textContent='Không chạy được Pre-Rule';
  }
});
</script>
<script src="/static/shell.js" data-shell-tab="ops"></script>
</body>
</html>
