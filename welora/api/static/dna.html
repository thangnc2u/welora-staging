<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DNA tài chính</title>
<style>
body{font-family:system-ui;background:#0b0f14;color:#e8eef7;margin:0;padding:16px;max-width:480px;margin-inline:auto}
a{color:#7dd3fc;text-decoration:none}
.card{background:#141b24;border:1px solid #243041;border-radius:12px;padding:14px;margin:10px 0}
.label{color:#8b9bb4;font-size:13px}
.val{margin-top:4px;font-weight:600}
.muted{color:#8b9bb4;font-size:13px}
.empty{color:#8b9bb4;margin-top:16px}
</style>
</head>
<body>
<p><a id="navHome" href="/app">← Welora</a></p>
<h1>DNA tài chính</h1>
<p class="muted">Hồ sơ bạn khai khi Bắt đầu</p>
<div id="dna"></div>
<script>
const KEY='welora_device_id';
function deviceId(){
  let d=localStorage.getItem(KEY);
  if(!d){d='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY,d);}
  return d;
}
function showEmpty(){
  const box=document.getElementById('dna');
  box.textContent='';
  const p=document.createElement('p');
  p.className='empty';
  p.id='emptyState';
  p.textContent='Chưa có DNA tài chính. Hãy hoàn tất Bắt đầu rồi quay lại đây.';
  box.appendChild(p);
}
function pick(obj,key){
  if(obj&&obj[key]!==undefined&&obj[key]!==null&&obj[key]!=='') return obj[key];
  return null;
}
function row(label,value){
  const el=document.createElement('div');
  el.className='card';
  const l=document.createElement('div');
  l.className='label';
  l.textContent=label;
  const v=document.createElement('div');
  v.className='val';
  v.textContent=value===null||value===undefined?'—':String(value);
  el.appendChild(l);
  el.appendChild(v);
  return el;
}
function render(data){
  const box=document.getElementById('dna');
  box.textContent='';
  const ident=data.identity_context||{};
  const snap=data.financial_snapshot_self||{};
  const psy=data.psychological_profile_self||{};
  const fields=[
    ['Giai đoạn sống', pick(ident,'life_stage')??data.life_stage],
    ['Ổn định thu nhập', pick(ident,'income_stability')??data.income_stability],
    ['Hoàn cảnh gia đình', pick(ident,'family_context')??data.family_context],
    ['Chi tiêu thiết yếu / tháng', pick(snap,'essential_expense_monthly')??data.essential_expense_monthly],
    ['Tháng quỹ khẩn cấp', pick(snap,'emergency_fund_months_self')??data.emergency_fund_months_self],
    ['Có nợ nguy hiểm', pick(snap,'has_dangerous_debt_self')??data.has_dangerous_debt_self],
    ['Ưu tiên ngắn hạn', pick(snap,'near_term_priority')??data.near_term_priority],
    ['Thói quen thặng dư', pick(psy,'surplus_habit')??data.surplus_habit],
    ['Chấp nhận rủi ro', pick(psy,'risk_tolerance')??data.risk_tolerance],
    ['Vai trò Agent ưa thích', pick(psy,'agent_role_preference')??data.agent_role_preference]
  ];
  fields.forEach(([k,v])=>box.appendChild(row(k,v)));
}
(async()=>{
  try{
    const auth=await fetch('/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId()})});
    const a=await auth.json();
    const uid=a.user_id||a.user||'';
    const dr=await fetch('/users/'+encodeURIComponent(uid)+'/dna');
    if(dr.status===404||!dr.ok){showEmpty();return;}
    const data=await dr.json();
    render(data);
  }catch(e){
    showEmpty();
  }
})();
</script>
</body>
</html>
